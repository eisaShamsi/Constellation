<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>360.3D Concept 3 — Neural Web</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { background: #060612; color: #e0e0e0; font-family: 'Segoe UI', system-ui, sans-serif; overflow: hidden; height: 100vh; }

.container { position: relative; width: 100vw; height: 100vh; display: flex; align-items: center; justify-content: center; }

/* Neural background texture */
.neural-bg { position: absolute; inset: 0; background: radial-gradient(ellipse at 50% 45%, #0e0e28 0%, #060612 70%); }

/* Header */
.header { position: absolute; top: 0; left: 0; right: 0; display: flex; align-items: center; padding: 14px 24px; z-index: 20; background: linear-gradient(180deg, rgba(6,6,18,0.95) 0%, transparent 100%); }
.h-icon { font-size: 18px; margin-right: 10px; }
.h-label { font-size: 11px; color: #7c3aed; font-weight: 700; letter-spacing: 2px; text-transform: uppercase; }
.h-name { font-size: 20px; font-weight: 700; margin-left: 16px; color: #f0f0f0; }
.h-close { margin-left: auto; width: 36px; height: 36px; border-radius: 50%; border: 1px solid rgba(255,255,255,0.1); background: rgba(255,255,255,0.03); color: #888; font-size: 20px; cursor: pointer; display: flex; align-items: center; justify-content: center; }
.h-close:hover { background: rgba(255,255,255,0.08); color: #fff; }

/* SVG canvas */
svg.neural { position: absolute; inset: 0; width: 100%; height: 100%; }

/* Pulsing animation */
@keyframes pulse-node { 0%, 100% { r: 8; } 50% { r: 10; } }
@keyframes pulse-glow { 0%, 100% { opacity: 0.3; } 50% { opacity: 0.6; } }

/* Bottom HUD */
.hud { position: absolute; bottom: 0; left: 0; right: 0; padding: 12px 24px; display: flex; justify-content: space-between; z-index: 20; background: linear-gradient(0deg, rgba(6,6,18,0.95) 0%, transparent 100%); }
.hud-left, .hud-right { display: flex; gap: 16px; font-size: 10px; }
.hud-item { display: flex; align-items: center; gap: 5px; color: rgba(255,255,255,0.4); }
.hud-dot { width: 8px; height: 8px; border-radius: 50%; }
.hud-warn { color: #ef4444; }

/* Side panels */
.side-panel { position: absolute; z-index: 15; padding: 12px 16px; border-radius: 12px; background: rgba(12,12,30,0.8); border: 1px solid rgba(255,255,255,0.06); backdrop-filter: blur(10px); font-size: 10px; line-height: 1.8; max-width: 180px; }
.sp-title { font-weight: 700; font-size: 11px; color: #a78bfa; margin-bottom: 4px; letter-spacing: 0.5px; }
.sp-item { display: flex; align-items: center; gap: 6px; color: rgba(255,255,255,0.5); }
.sp-badge { padding: 1px 6px; border-radius: 4px; font-size: 8px; font-weight: 600; }
</style>
</head>
<body>
<div class="container">
  <div class="neural-bg"></div>

  <div class="header">
    <span class="h-icon">🧠</span>
    <span class="h-label">Neural 360.3D</span>
    <span class="h-name">Theory of Causal Systems</span>
    <button class="h-close">×</button>
  </div>

  <!-- Neural web SVG -->
  <svg class="neural" viewBox="0 0 1200 800" preserveAspectRatio="xMidYMid meet">
    <defs>
      <!-- Glow filters -->
      <filter id="glow-blue"><feGaussianBlur stdDeviation="4" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
      <filter id="glow-red"><feGaussianBlur stdDeviation="4" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
      <filter id="glow-gold"><feGaussianBlur stdDeviation="4" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
      <filter id="glow-purple"><feGaussianBlur stdDeviation="3" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
      <filter id="glow-center"><feGaussianBlur stdDeviation="8" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
      <!-- Radial gradient for center -->
      <radialGradient id="center-grad">
        <stop offset="0%" stop-color="#a78bfa" stop-opacity="0.4"/>
        <stop offset="50%" stop-color="#7c3aed" stop-opacity="0.15"/>
        <stop offset="100%" stop-color="#7c3aed" stop-opacity="0"/>
      </radialGradient>
    </defs>

    <!-- Center ambient glow -->
    <circle cx="600" cy="400" r="120" fill="url(#center-grad)" filter="url(#glow-center)"/>

    <!-- Neural connections (synaptic lines) -->
    <!-- Supports (blue) -->
    <line x1="600" y1="400" x2="520" y2="240" stroke="#4A9EFF" stroke-width="1.5" opacity="0.3"/>
    <line x1="600" y1="400" x2="680" y2="210" stroke="#4A9EFF" stroke-width="1" opacity="0.2"/>
    <line x1="600" y1="400" x2="560" y2="180" stroke="#4A9EFF" stroke-width="0.8" opacity="0.15"/>
    <!-- Branching from first-order to second-order -->
    <line x1="520" y1="240" x2="440" y2="150" stroke="#4A9EFF" stroke-width="0.5" opacity="0.1"/>
    <line x1="520" y1="240" x2="560" y2="120" stroke="#4A9EFF" stroke-width="0.5" opacity="0.1"/>
    <line x1="680" y1="210" x2="760" y2="130" stroke="#4A9EFF" stroke-width="0.5" opacity="0.1"/>

    <!-- Contradicts (red) -->
    <line x1="600" y1="400" x2="580" y2="580" stroke="#FF4A4A" stroke-width="1.5" opacity="0.3"/>
    <line x1="580" y1="580" x2="500" y2="670" stroke="#FF4A4A" stroke-width="0.5" opacity="0.1"/>

    <!-- Causes (orange) -->
    <line x1="600" y1="400" x2="820" y2="380" stroke="#FF8C42" stroke-width="1.2" opacity="0.25"/>
    <line x1="600" y1="400" x2="850" y2="450" stroke="#FF8C42" stroke-width="0.8" opacity="0.15"/>
    <line x1="820" y1="380" x2="950" y2="340" stroke="#FF8C42" stroke-width="0.5" opacity="0.1"/>

    <!-- Derives-from (gold) -->
    <line x1="600" y1="400" x2="370" y2="420" stroke="#FFD700" stroke-width="1.5" opacity="0.3"/>
    <line x1="370" y1="420" x2="230" y2="450" stroke="#FFD700" stroke-width="0.5" opacity="0.12"/>

    <!-- Generalizes (purple) -->
    <line x1="600" y1="400" x2="780" y2="250" stroke="#A44AFF" stroke-width="1" opacity="0.2"/>

    <!-- Gap zone indicators (dashed circles in empty directions) -->
    <circle cx="420" cy="250" r="40" fill="none" stroke="rgba(255,255,255,0.04)" stroke-dasharray="4,6" stroke-width="0.5"/>
    <text x="420" y="253" text-anchor="middle" font-size="7" fill="rgba(255,255,255,0.08)">exemplifies</text>
    <circle cx="780" cy="550" r="40" fill="none" stroke="rgba(255,255,255,0.04)" stroke-dasharray="4,6" stroke-width="0.5"/>
    <text x="780" y="553" text-anchor="middle" font-size="7" fill="rgba(255,255,255,0.08)">part-of</text>

    <!-- Nodes — First order (larger, brighter) -->
    <!-- Supports -->
    <circle cx="520" cy="240" r="9" fill="#4A9EFF" opacity="0.8" filter="url(#glow-blue)" style="cursor:pointer">
      <animate attributeName="r" values="9;10;9" dur="3s" repeatCount="indefinite"/>
    </circle>
    <text x="520" y="225" text-anchor="middle" font-size="8" fill="rgba(255,255,255,0.5)">Evidence Study</text>

    <circle cx="680" cy="210" r="7" fill="#4A9EFF" opacity="0.7" filter="url(#glow-blue)" style="cursor:pointer"/>
    <text x="680" y="195" text-anchor="middle" font-size="8" fill="rgba(255,255,255,0.4)">Research Paper</text>

    <circle cx="560" cy="180" r="6" fill="#4A9EFF" opacity="0.5" style="cursor:pointer"/>

    <!-- Contradicts -->
    <circle cx="580" cy="580" r="8" fill="#FF4A4A" opacity="0.8" filter="url(#glow-red)" style="cursor:pointer">
      <animate attributeName="r" values="8;9;8" dur="2.5s" repeatCount="indefinite"/>
    </circle>
    <text x="580" y="600" text-anchor="middle" font-size="8" fill="rgba(255,255,255,0.5)">Counter Argument</text>

    <!-- Causes -->
    <circle cx="820" cy="380" r="7" fill="#FF8C42" opacity="0.7" style="cursor:pointer"/>
    <text x="820" y="365" text-anchor="middle" font-size="8" fill="rgba(255,255,255,0.4)">Policy Impact</text>
    <circle cx="850" cy="450" r="6" fill="#FF8C42" opacity="0.5" style="cursor:pointer"/>

    <!-- Derives-from -->
    <circle cx="370" cy="420" r="9" fill="#FFD700" opacity="0.8" filter="url(#glow-gold)" style="cursor:pointer">
      <animate attributeName="r" values="9;10;9" dur="4s" repeatCount="indefinite"/>
    </circle>
    <text x="370" y="405" text-anchor="middle" font-size="8" fill="rgba(255,255,255,0.5)">Source Book</text>

    <!-- Generalizes -->
    <circle cx="780" cy="250" r="7" fill="#A44AFF" opacity="0.7" filter="url(#glow-purple)" style="cursor:pointer"/>
    <text x="780" y="235" text-anchor="middle" font-size="8" fill="rgba(255,255,255,0.4)">Meta-Theory</text>

    <!-- Second order (smaller, dimmer) -->
    <circle cx="440" cy="150" r="4" fill="#4A9EFF" opacity="0.3" style="cursor:pointer"/>
    <circle cx="560" cy="120" r="3" fill="#4A9EFF" opacity="0.25" style="cursor:pointer"/>
    <circle cx="760" cy="130" r="4" fill="#4A9EFF" opacity="0.3" style="cursor:pointer"/>
    <circle cx="500" cy="670" r="3" fill="#FF4A4A" opacity="0.25" style="cursor:pointer"/>
    <circle cx="950" cy="340" r="4" fill="#FF8C42" opacity="0.25" style="cursor:pointer"/>
    <circle cx="230" cy="450" r="4" fill="#FFD700" opacity="0.3" style="cursor:pointer"/>

    <!-- Center node -->
    <circle cx="600" cy="400" r="28" fill="#1a1a3a" stroke="#a78bfa" stroke-width="2" filter="url(#glow-center)"/>
    <circle cx="600" cy="400" r="22" fill="#12122a"/>
    <text x="600" y="395" text-anchor="middle" font-size="10" font-weight="700" fill="#fff">Causal</text>
    <text x="600" y="408" text-anchor="middle" font-size="10" font-weight="700" fill="#fff">Systems</text>
    <text x="600" y="422" text-anchor="middle" font-size="7" fill="#a78bfa">L6 · Theory</text>

    <!-- Depth ring labels -->
    <circle cx="600" cy="400" r="130" fill="none" stroke="rgba(255,255,255,0.04)" stroke-width="0.5"/>
    <text x="735" y="398" font-size="6" fill="rgba(255,255,255,0.08)">depth 1</text>
    <circle cx="600" cy="400" r="220" fill="none" stroke="rgba(255,255,255,0.025)" stroke-width="0.5"/>
    <text x="825" y="398" font-size="6" fill="rgba(255,255,255,0.06)">depth 2</text>
    <circle cx="600" cy="400" r="320" fill="none" stroke="rgba(255,255,255,0.015)" stroke-width="0.5" stroke-dasharray="2,4"/>
    <text x="925" y="398" font-size="6" fill="rgba(255,255,255,0.04)">depth 3</text>
  </svg>

  <!-- Side panels -->
  <div class="side-panel" style="top: 80px; right: 20px;">
    <div class="sp-title">Dimensions</div>
    <div class="sp-item"><span class="hud-dot" style="background:#16a34a;"></span> Evergreen</div>
    <div class="sp-item"><span class="hud-dot" style="background:#4A9EFF;"></span> Received · Depth 3</div>
    <div class="sp-item"><span class="hud-dot" style="background:#a78bfa;"></span> Permanent</div>
    <div class="sp-item"><span class="hud-dot" style="background:#FFD700;"></span> Trust: 3 hops</div>
  </div>

  <div class="side-panel" style="bottom: 60px; left: 20px;">
    <div class="sp-title">Context</div>
    <div class="sp-item">🛤️ Trail: "Causality Path"</div>
    <div class="sp-item">🏷️ philosophy, systems</div>
    <div class="sp-item" style="color:#ef4444;">⚠ 2 gaps (exemplifies, part-of)</div>
  </div>

  <!-- Bottom HUD -->
  <div class="hud">
    <div class="hud-left">
      <span class="hud-item">⬆ 7 outbound</span>
      <span class="hud-item">⬇ 11 inbound</span>
      <span class="hud-item">📝 2,800 words</span>
    </div>
    <div class="hud-right">
      <span class="hud-item">📋 Due for review</span>
      <span class="hud-item hud-warn">⚠ 2 blind spots</span>
    </div>
  </div>
</div>
</body>
</html>
