<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Constellation — First-Time Wizard Flowchart</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'Inter', sans-serif;
    background: #0c1322;
    color: #e8ecf4;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 40px 20px 60px;
  }
  h1 {
    font-size: 20px;
    font-weight: 600;
    color: #c4a767;
    letter-spacing: 0.06em;
    margin-bottom: 8px;
  }
  .subtitle {
    font-size: 12px;
    color: #5a6a8a;
    margin-bottom: 40px;
    letter-spacing: 0.03em;
  }
  svg { max-width: 100%; height: auto; }
  .chart-note {
    margin-top: 36px;
    max-width: 800px;
    display: flex;
    gap: 20px;
    flex-wrap: wrap;
    justify-content: center;
  }
  .legend-item {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 11px;
    color: #6a7a9a;
  }
  .legend-swatch {
    width: 14px;
    height: 14px;
    border-radius: 4px;
    flex-shrink: 0;
  }
</style>
</head>
<body>

<h1>First-Time Wizard — Flow</h1>
<div class="subtitle">Constellation v0.1.0</div>

<svg viewBox="0 0 1060 1100" width="1060" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arrow" viewBox="0 0 10 7" refX="10" refY="3.5" markerWidth="10" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 3.5 L 0 7 z" fill="#c4a767"/>
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 7" refX="10" refY="3.5" markerWidth="10" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 3.5 L 0 7 z" fill="#63b3ed"/>
    </marker>
    <marker id="arrow-gold" viewBox="0 0 10 7" refX="10" refY="3.5" markerWidth="10" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 3.5 L 0 7 z" fill="#c4a767"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 7" refX="10" refY="3.5" markerWidth="10" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 3.5 L 0 7 z" fill="#9acd9b"/>
    </marker>
    <marker id="arrow-gray" viewBox="0 0 10 7" refX="10" refY="3.5" markerWidth="10" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 3.5 L 0 7 z" fill="#4a5a7a"/>
    </marker>
    <marker id="arrow-purple" viewBox="0 0 10 7" refX="10" refY="3.5" markerWidth="10" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 3.5 L 0 7 z" fill="#b39ddb"/>
    </marker>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- ============================================ -->
  <!-- ROW 0: APP LAUNCH                            -->
  <!-- ============================================ -->
  <rect x="430" y="10" width="200" height="46" rx="23" fill="#1a2744" stroke="#c4a767" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="530" y="38" text-anchor="middle" font-family="Inter,sans-serif" font-size="13" font-weight="600" fill="#c4a767">App Launch</text>

  <line x1="530" y1="56" x2="530" y2="90" stroke="#c4a767" stroke-width="1.2" marker-end="url(#arrow)"/>

  <!-- ============================================ -->
  <!-- DECISION: First time?                        -->
  <!-- ============================================ -->
  <polygon points="530,90 630,125 530,160 430,125" fill="#1a2744" stroke="#c4a767" stroke-width="1.2" filter="url(#shadow)"/>
  <text x="530" y="129" text-anchor="middle" font-family="Inter,sans-serif" font-size="11" font-weight="500" fill="#e8ecf4">First time?</text>

  <!-- No — right to Load last -->
  <line x1="630" y1="125" x2="780" y2="125" stroke="#4a5a7a" stroke-width="1" stroke-dasharray="5 3" marker-end="url(#arrow-gray)"/>
  <text x="690" y="118" text-anchor="middle" font-family="Inter,sans-serif" font-size="10" fill="#4a5a7a">No</text>
  <rect x="785" y="105" width="170" height="40" rx="8" fill="#162040" stroke="#4a5a7a" stroke-width="0.8"/>
  <text x="870" y="129" text-anchor="middle" font-family="Inter,sans-serif" font-size="11" fill="#6a7a9a">Load last universe</text>

  <!-- Load last → Main App (right side bypass) -->
  <line x1="955" y1="125" x2="1020" y2="125" stroke="#4a5a7a" stroke-width="1" stroke-dasharray="5 3"/>
  <line x1="1020" y1="125" x2="1020" y2="1040" stroke="#4a5a7a" stroke-width="1" stroke-dasharray="5 3"/>
  <line x1="1020" y1="1040" x2="640" y2="1040" stroke="#4a5a7a" stroke-width="1" stroke-dasharray="5 3" marker-end="url(#arrow-gray)"/>

  <!-- Yes — down -->
  <line x1="530" y1="160" x2="530" y2="200" stroke="#c4a767" stroke-width="1.2" marker-end="url(#arrow)"/>
  <text x="540" y="183" font-family="Inter,sans-serif" font-size="10" fill="#c4a767">Yes</text>

  <!-- ============================================ -->
  <!-- WELCOME SCREEN                               -->
  <!-- ============================================ -->
  <rect x="380" y="200" width="300" height="54" rx="12" fill="#1a3361" stroke="#c4a767" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="530" y="223" text-anchor="middle" font-family="Inter,sans-serif" font-size="14" font-weight="700" fill="#ffffff">Welcome Screen</text>
  <text x="530" y="241" text-anchor="middle" font-family="Inter,sans-serif" font-size="10" fill="#8899b8">Choose how to begin</text>

  <!-- Three branches -->
  <line x1="530" y1="254" x2="530" y2="280" stroke="#c4a767" stroke-width="1"/>
  <line x1="150" y1="280" x2="880" y2="280" stroke="#c4a767" stroke-width="1"/>
  <line x1="150" y1="280" x2="150" y2="320" stroke="#63b3ed" stroke-width="1.2" marker-end="url(#arrow-blue)"/>
  <line x1="530" y1="280" x2="530" y2="320" stroke="#c4a767" stroke-width="1.2" marker-end="url(#arrow-gold)"/>
  <line x1="880" y1="280" x2="880" y2="320" stroke="#9acd9b" stroke-width="1.2" marker-end="url(#arrow-green)"/>

  <!-- ============================================ -->
  <!-- BRANCH 1: NEW UNIVERSE (Left — Blue)         -->
  <!-- ============================================ -->
  <rect x="50" y="320" width="200" height="50" rx="10" fill="#132744" stroke="#63b3ed" stroke-width="1.2" filter="url(#shadow)"/>
  <text x="150" y="342" text-anchor="middle" font-family="Inter,sans-serif" font-size="12" font-weight="600" fill="#63b3ed">New Universe</text>
  <text x="150" y="358" text-anchor="middle" font-family="Inter,sans-serif" font-size="10" fill="#8899b8">Enter universe name</text>

  <line x1="150" y1="370" x2="150" y2="410" stroke="#63b3ed" stroke-width="1" marker-end="url(#arrow-blue)"/>

  <rect x="50" y="410" width="200" height="50" rx="10" fill="#132744" stroke="#63b3ed" stroke-width="1.2" filter="url(#shadow)"/>
  <text x="150" y="432" text-anchor="middle" font-family="Inter,sans-serif" font-size="12" font-weight="600" fill="#ffffff">Choose Location</text>
  <text x="150" y="448" text-anchor="middle" font-family="Inter,sans-serif" font-size="10" fill="#8899b8">Where to save your universe</text>

  <line x1="150" y1="460" x2="150" y2="500" stroke="#63b3ed" stroke-width="1" marker-end="url(#arrow-blue)"/>

  <rect x="40" y="500" width="220" height="50" rx="10" fill="#132744" stroke="#63b3ed" stroke-width="1" filter="url(#shadow)"/>
  <text x="150" y="520" text-anchor="middle" font-family="Inter,sans-serif" font-size="11" font-weight="500" fill="#ffffff">Create .constellation/</text>
  <text x="150" y="537" text-anchor="middle" font-family="Inter,sans-serif" font-size="9.5" fill="#63b3ed">Initialize universe directory</text>

  <!-- Arrow down to shared Add Libraries -->
  <line x1="150" y1="550" x2="150" y2="680" stroke="#63b3ed" stroke-width="1"/>
  <line x1="150" y1="680" x2="340" y2="680" stroke="#63b3ed" stroke-width="1" marker-end="url(#arrow-blue)"/>

  <!-- ============================================ -->
  <!-- BRANCH 2: OPEN UNIVERSE (Center — Gold)      -->
  <!-- ============================================ -->
  <rect x="410" y="320" width="240" height="50" rx="10" fill="#1e2a18" stroke="#c4a767" stroke-width="1.2" filter="url(#shadow)"/>
  <text x="530" y="342" text-anchor="middle" font-family="Inter,sans-serif" font-size="12" font-weight="600" fill="#c4a767">Open Universe</text>
  <text x="530" y="358" text-anchor="middle" font-family="Inter,sans-serif" font-size="10" fill="#8899b8">Browse for a universe folder</text>

  <line x1="530" y1="370" x2="530" y2="410" stroke="#c4a767" stroke-width="1" marker-end="url(#arrow-gold)"/>

  <!-- Decision: .constellation/ found? -->
  <polygon points="530,410 620,445 530,480 440,445" fill="#1a2744" stroke="#c4a767" stroke-width="1" filter="url(#shadow)"/>
  <text x="530" y="441" text-anchor="middle" font-family="Inter,sans-serif" font-size="10" font-weight="500" fill="#e8ecf4">.constellation/</text>
  <text x="530" y="455" text-anchor="middle" font-family="Inter,sans-serif" font-size="10" font-weight="500" fill="#e8ecf4">found?</text>

  <!-- No — left to error -->
  <line x1="440" y1="445" x2="370" y2="445" stroke="#e88" stroke-width="1" stroke-dasharray="4 3"/>
  <text x="406" y="438" font-family="Inter,sans-serif" font-size="9" fill="#e88">No</text>
  <rect x="310" y="425" width="60" height="40" rx="8" fill="#2a1a1a" stroke="#e88" stroke-width="0.8"/>
  <text x="340" y="444" text-anchor="middle" font-family="Inter,sans-serif" font-size="18" fill="#e88">!</text>
  <text x="340" y="458" text-anchor="middle" font-family="Inter,sans-serif" font-size="8" fill="#a66">Invalid</text>

  <!-- Yes — down -->
  <line x1="530" y1="480" x2="530" y2="520" stroke="#c4a767" stroke-width="1" marker-end="url(#arrow-gold)"/>
  <text x="542" y="503" font-family="Inter,sans-serif" font-size="10" fill="#9acd9b">Yes</text>

  <!-- Load Universe -->
  <rect x="420" y="520" width="220" height="50" rx="10" fill="#1e2a18" stroke="#c4a767" stroke-width="1" filter="url(#shadow)"/>
  <text x="530" y="540" text-anchor="middle" font-family="Inter,sans-serif" font-size="11" font-weight="500" fill="#ffffff">Load Universe</text>
  <text x="530" y="556" text-anchor="middle" font-family="Inter,sans-serif" font-size="9.5" fill="#c4a767">Read settings, libraries, caches</text>

  <line x1="530" y1="570" x2="530" y2="610" stroke="#c4a767" stroke-width="1" marker-end="url(#arrow-gold)"/>

  <!-- Decision: Library paths reachable? -->
  <polygon points="530,610 630,645 530,680 430,645" fill="#1a2744" stroke="#c4a767" stroke-width="1" filter="url(#shadow)"/>
  <text x="530" y="641" text-anchor="middle" font-family="Inter,sans-serif" font-size="10" font-weight="500" fill="#e8ecf4">Library paths</text>
  <text x="530" y="655" text-anchor="middle" font-family="Inter,sans-serif" font-size="10" font-weight="500" fill="#e8ecf4">reachable?</text>

  <!-- No — right to re-map -->
  <line x1="630" y1="645" x2="700" y2="645" stroke="#e88" stroke-width="1" stroke-dasharray="4 3"/>
  <text x="660" y="638" font-family="Inter,sans-serif" font-size="9" fill="#e88">No</text>
  <rect x="700" y="622" width="150" height="46" rx="8" fill="#2a1a1a" stroke="#e88" stroke-width="0.8" filter="url(#shadow)"/>
  <text x="775" y="642" text-anchor="middle" font-family="Inter,sans-serif" font-size="10" font-weight="500" fill="#e88">Re-map Paths</text>
  <text x="775" y="656" text-anchor="middle" font-family="Inter,sans-serif" font-size="9" fill="#a66">New machine? Re-locate</text>

  <!-- Re-map loops back to "reachable?" -->
  <line x1="775" y1="668" x2="775" y2="688" stroke="#e88" stroke-width="0.8" stroke-dasharray="4 3"/>
  <path d="M 775 688 Q 775 700 700 700 Q 530 700 530 680" stroke="#e88" stroke-width="0.8" stroke-dasharray="4 3" fill="none" marker-end="url(#arrow)"/>

  <!-- Yes — down to shared Add Libraries -->
  <line x1="530" y1="680" x2="530" y2="720" stroke="#c4a767" stroke-width="1"/>
  <text x="542" y="700" font-family="Inter,sans-serif" font-size="10" fill="#9acd9b">Yes</text>

  <!-- ============================================ -->
  <!-- BRANCH 3: LINK A LIBRARY (Right — Green)     -->
  <!-- ============================================ -->
  <rect x="760" y="320" width="240" height="50" rx="10" fill="#162218" stroke="#9acd9b" stroke-width="1.2" filter="url(#shadow)"/>
  <text x="880" y="342" text-anchor="middle" font-family="Inter,sans-serif" font-size="12" font-weight="600" fill="#9acd9b">Link a Library</text>
  <text x="880" y="358" text-anchor="middle" font-family="Inter,sans-serif" font-size="10" fill="#8899b8">Browse for a Markdown folder</text>

  <line x1="880" y1="370" x2="880" y2="410" stroke="#9acd9b" stroke-width="1" marker-end="url(#arrow-green)"/>

  <!-- Auto-name universe -->
  <rect x="760" y="410" width="240" height="50" rx="10" fill="#162218" stroke="#9acd9b" stroke-width="1" filter="url(#shadow)"/>
  <text x="880" y="432" text-anchor="middle" font-family="Inter,sans-serif" font-size="11" font-weight="500" fill="#ffffff">Auto-Create Universe</text>
  <text x="880" y="448" text-anchor="middle" font-family="Inter,sans-serif" font-size="9.5" fill="#9acd9b">Name from folder, .constellation/ inside</text>

  <line x1="880" y1="460" x2="880" y2="500" stroke="#9acd9b" stroke-width="1" marker-end="url(#arrow-green)"/>

  <!-- Register as library -->
  <rect x="760" y="500" width="240" height="50" rx="10" fill="#162218" stroke="#9acd9b" stroke-width="1" filter="url(#shadow)"/>
  <text x="880" y="522" text-anchor="middle" font-family="Inter,sans-serif" font-size="11" font-weight="500" fill="#ffffff">Register as Library</text>
  <text x="880" y="538" text-anchor="middle" font-family="Inter,sans-serif" font-size="9.5" fill="#9acd9b">Folder becomes the sole library</text>

  <!-- Down to shared Add Libraries -->
  <line x1="880" y1="550" x2="880" y2="680" stroke="#9acd9b" stroke-width="1"/>
  <line x1="880" y1="680" x2="720" y2="680" stroke="#9acd9b" stroke-width="1" marker-end="url(#arrow-green)"/>

  <!-- ============================================ -->
  <!-- SHARED: ADD LIBRARIES SUBPROCESS (Purple)    -->
  <!-- ============================================ -->
  <!-- Background container -->
  <rect x="340" y="720" width="380" height="230" rx="14" fill="rgba(179,157,219,0.06)" stroke="#b39ddb" stroke-width="1.2" stroke-dasharray="6 3" filter="url(#shadow)"/>
  <text x="530" y="745" text-anchor="middle" font-family="Inter,sans-serif" font-size="13" font-weight="700" fill="#b39ddb">Add / Link Libraries</text>
  <text x="530" y="762" text-anchor="middle" font-family="Inter,sans-serif" font-size="10" fill="#8a7ab8">Shared step — available in all paths</text>

  <!-- Browse folder -->
  <rect x="380" y="778" width="300" height="44" rx="8" fill="#1a1a2e" stroke="#b39ddb" stroke-width="0.8"/>
  <text x="530" y="798" text-anchor="middle" font-family="Inter,sans-serif" font-size="11" font-weight="500" fill="#ffffff">Browse for Markdown folders</text>
  <text x="530" y="813" text-anchor="middle" font-family="Inter,sans-serif" font-size="9" fill="#8a7ab8">Plain folders, Obsidian vaults, Logseq graphs...</text>

  <line x1="530" y1="822" x2="530" y2="848" stroke="#b39ddb" stroke-width="0.8" marker-end="url(#arrow-purple)"/>

  <!-- Detection -->
  <polygon points="530,848 610,872 530,896 450,872" fill="#1a1a2e" stroke="#b39ddb" stroke-width="0.8"/>
  <text x="530" y="868" text-anchor="middle" font-family="Inter,sans-serif" font-size="9.5" font-weight="500" fill="#e8ecf4">.obsidian/</text>
  <text x="530" y="881" text-anchor="middle" font-family="Inter,sans-serif" font-size="9.5" font-weight="500" fill="#e8ecf4">detected?</text>

  <!-- Yes — right annotation -->
  <line x1="610" y1="872" x2="660" y2="872" stroke="#9acd9b" stroke-width="0.8" stroke-dasharray="3 2"/>
  <text x="630" y="864" font-family="Inter,sans-serif" font-size="8.5" fill="#9acd9b">Yes</text>
  <rect x="660" y="855" width="48" height="34" rx="5" fill="#1a2a1a" stroke="#6a9a6a" stroke-width="0.6"/>
  <text x="684" y="870" text-anchor="middle" font-family="Inter,sans-serif" font-size="8" fill="#7aaa7a">Import</text>
  <text x="684" y="882" text-anchor="middle" font-family="Inter,sans-serif" font-size="8" fill="#7aaa7a">theme</text>

  <!-- No — just continues down (both paths merge) -->
  <text x="456" y="864" font-family="Inter,sans-serif" font-size="8.5" fill="#6a7a9a">No</text>

  <!-- Repeat indicator -->
  <rect x="380" y="905" width="300" height="34" rx="8" fill="#1a1a2e" stroke="#b39ddb" stroke-width="0.6" stroke-dasharray="4 2"/>
  <text x="530" y="920" text-anchor="middle" font-family="Inter,sans-serif" font-size="10" fill="#b39ddb">+ Add more libraries    |    + Add child universes</text>
  <text x="530" y="934" text-anchor="middle" font-family="Inter,sans-serif" font-size="8.5" fill="#6a5a8a">Optional — repeat as needed</text>

  <!-- Arrow from detection down to repeat (both yes/no) -->
  <line x1="530" y1="896" x2="530" y2="905" stroke="#b39ddb" stroke-width="0.6"/>

  <!-- ============================================ -->
  <!-- MERGE POINT                                  -->
  <!-- ============================================ -->
  <line x1="530" y1="950" x2="530" y2="990" stroke="#c4a767" stroke-width="1.2" marker-end="url(#arrow)"/>

  <circle cx="530" cy="1000" r="8" fill="#c4a767" filter="url(#glow)"/>

  <line x1="530" y1="1008" x2="530" y2="1020" stroke="#c4a767" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- ============================================ -->
  <!-- MAIN APP                                     -->
  <!-- ============================================ -->
  <rect x="420" y="1020" width="220" height="50" rx="12" fill="#1a3361" stroke="#c4a767" stroke-width="2" filter="url(#shadow)"/>
  <text x="530" y="1043" text-anchor="middle" font-family="Inter,sans-serif" font-size="14" font-weight="700" fill="#c4a767">Main App</text>
  <text x="530" y="1059" text-anchor="middle" font-family="Inter,sans-serif" font-size="10" fill="#8899b8">Universe loaded</text>

  <!-- ============================================ -->
  <!-- ANNOTATIONS                                  -->
  <!-- ============================================ -->
  <!-- Non-destructive note near the shared subprocess -->
  <rect x="45" y="770" width="260" height="60" rx="8" fill="rgba(154,205,155,0.08)" stroke="#6a9a6a" stroke-width="0.6"/>
  <text x="175" y="792" text-anchor="middle" font-family="Inter,sans-serif" font-size="10" fill="#9acd9b" font-weight="500">Non-destructive</text>
  <text x="175" y="808" text-anchor="middle" font-family="Inter,sans-serif" font-size="9" fill="#5a8a5a">Reads .obsidian/ appearance only.</text>
  <text x="175" y="821" text-anchor="middle" font-family="Inter,sans-serif" font-size="9" fill="#5a8a5a">Never writes to library files.</text>

  <!-- Dashed connector from note to subprocess -->
  <line x1="305" y1="800" x2="340" y2="800" stroke="#6a9a6a" stroke-width="0.5" stroke-dasharray="3 2"/>

  <!-- Branch labels on the horizontal line -->
  <text x="150" y="296" text-anchor="middle" font-family="Inter,sans-serif" font-size="9" font-weight="600" fill="#63b3ed">OPT 1</text>
  <text x="530" y="296" text-anchor="middle" font-family="Inter,sans-serif" font-size="9" font-weight="600" fill="#c4a767">OPT 2</text>
  <text x="880" y="296" text-anchor="middle" font-family="Inter,sans-serif" font-size="9" font-weight="600" fill="#9acd9b">OPT 3</text>

</svg>

<!-- Legend -->
<div class="chart-note">
  <div class="legend-item">
    <div class="legend-swatch" style="background: #63b3ed;"></div>
    <span>New Universe</span>
  </div>
  <div class="legend-item">
    <div class="legend-swatch" style="background: #c4a767;"></div>
    <span>Open Universe</span>
  </div>
  <div class="legend-item">
    <div class="legend-swatch" style="background: #9acd9b;"></div>
    <span>Link a Library</span>
  </div>
  <div class="legend-item">
    <div class="legend-swatch" style="background: #b39ddb;"></div>
    <span>Shared: Add Libraries</span>
  </div>
  <div class="legend-item">
    <div class="legend-swatch" style="background: #e88; border-radius: 50%;"></div>
    <span>Error / re-map</span>
  </div>
  <div class="legend-item">
    <div class="legend-swatch" style="background: transparent; border: 1px dashed #4a5a7a;"></div>
    <span>Returning user</span>
  </div>
</div>

</body>
</html>
