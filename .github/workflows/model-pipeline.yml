name: Model Pipeline (Constellation Mind)

# MIG-047 Phase 0b Step A — produces the GGUF model files Constellation
# Mind installs at first launch. Runs ON-DEMAND ONLY (workflow_dispatch);
# not part of the app release.yml. Each model lives in its own GitHub
# Release tag (models/<name>-q4km-v<n>) so model updates and app updates
# are independent.
#
# Per MIG-047 §4 D (Eisa's "No cloud service at all" lock): no
# Constellation-operated cloud infrastructure. Distribution = GitHub
# Releases with file-splitting. The 2 GiB per-file limit of GH Releases
# is solved by POSIX `split -b 1700M`; the Tauri downloader on the user
# side concatenates parts + SHA-256-verifies before loading.
#
# Per MIG-047 §10.5 Q2: in-house quantization from the official QCRI
# safetensors (NOT depending on the community quant). Reproducibility:
# pin the llama.cpp release tag in `LLAMA_CPP_TAG` below; document any
# bump in the Release notes.

on:
  workflow_dispatch:
    inputs:
      model:
        description: 'Which model to quantize + release'
        required: true
        type: choice
        options:
          - fanar-1-9b-q4km
          # Phase 2.5 (MIG-050) adds:
          # - jais-2-8b-chat-q4km (requires HF token secret for the gated repo)
      version:
        description: 'Version tag for this model release (e.g. v1, v2)'
        required: true
        type: string
        default: 'v1'

env:
  # Pin llama.cpp to a known-good release for reproducibility.
  # Bump deliberately; record the change in the model Release notes.
  LLAMA_CPP_TAG: 'b6285'

jobs:
  quantize:
    if: ${{ inputs.model == 'fanar-1-9b-q4km' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write     # for softprops/action-gh-release
    timeout-minutes: 90

    env:
      MODEL_ID: ${{ inputs.model }}
      MODEL_VERSION: ${{ inputs.version }}
      RELEASE_TAG: models/${{ inputs.model }}-${{ inputs.version }}
      HF_REPO: 'QCRI/Fanar-1-9B-Instruct'
      OUTPUT_NAME: 'fanar-1-9b-q4km.gguf'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ubuntu-latest has ~14 GB free disk; we need ~36 GB peak
      # (safetensors ~18 GB + FP16 GGUF ~18 GB + Q4_K_M output ~5 GB
      # during quantize). Free up the preinstalled SDKs we don't need.
      - name: Free disk space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          swap-storage: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python deps for convert_hf_to_gguf.py
        run: |
          python -m pip install --upgrade pip
          pip install \
            'huggingface_hub[cli,hf_transfer]>=0.24' \
            'torch==2.4.*' \
            'transformers>=4.45' \
            'sentencepiece>=0.2' \
            'numpy>=1.26' \
            'protobuf>=4.25' \
            'gguf>=0.10' \
            'tiktoken>=0.7'

      - name: Clone llama.cpp (pinned)
        run: |
          git clone --depth 1 --branch "${LLAMA_CPP_TAG}" https://github.com/ggml-org/llama.cpp.git llama.cpp
          echo "Pinned llama.cpp ${LLAMA_CPP_TAG}"

      - name: Build llama.cpp quantize binary (CPU-only)
        working-directory: llama.cpp
        run: |
          cmake -B build -DGGML_BACKEND=cpu -DLLAMA_CURL=OFF -DLLAMA_BUILD_TESTS=OFF -DLLAMA_BUILD_SERVER=OFF
          cmake --build build --config Release --target llama-quantize -j

      - name: Download safetensors from Hugging Face (Fanar is PUBLIC; no auth needed)
        env:
          # Python snapshot_download is more robust than the `hf` CLI under
          # unauthenticated rate-limits — the CLI silently stalls after the
          # first few files. Python lets us specify resume_download + add an
          # explicit timeout. Use HF_TOKEN if set (workflow Secrets); else
          # rely on the public-repo path.
          HF_XET_HIGH_PERFORMANCE: '1'
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          mkdir -p safetensors
          python - <<'PY'
          import os, sys
          from huggingface_hub import snapshot_download
          token = os.environ.get("HF_TOKEN") or None
          path = snapshot_download(
              repo_id=os.environ["HF_REPO"],
              local_dir="safetensors",
              repo_type="model",
              token=token,
              max_workers=4,
          )
          print(f"Downloaded to: {path}")
          PY
          echo "Files:"
          ls -lh safetensors/

      - name: Convert safetensors → FP16 GGUF
        run: |
          python llama.cpp/convert_hf_to_gguf.py \
            safetensors/ \
            --outfile fanar-fp16.gguf \
            --outtype f16
          echo "FP16 GGUF size:"
          ls -lh fanar-fp16.gguf

      # Free up the safetensors before quantizing — peak disk savings.
      - name: Free safetensors disk
        run: rm -rf safetensors/

      - name: Quantize FP16 → Q4_K_M
        run: |
          ./llama.cpp/build/bin/llama-quantize \
            fanar-fp16.gguf \
            "${OUTPUT_NAME}" \
            Q4_K_M
          echo "Q4_K_M GGUF size:"
          ls -lh "${OUTPUT_NAME}"

      # Free up FP16 GGUF before splitting.
      - name: Free FP16 GGUF disk
        run: rm fanar-fp16.gguf

      - name: Compute final SHA-256 + size BEFORE splitting
        id: hash
        run: |
          FINAL_SHA=$(sha256sum "${OUTPUT_NAME}" | awk '{print $1}')
          FINAL_SIZE=$(stat -c %s "${OUTPUT_NAME}")
          echo "final_sha256=${FINAL_SHA}" >> "$GITHUB_OUTPUT"
          echo "final_size=${FINAL_SIZE}" >> "$GITHUB_OUTPUT"
          echo "Final SHA-256: ${FINAL_SHA}"
          echo "Final size:    ${FINAL_SIZE} bytes"

      - name: Split into ≤1.7 GiB chunks (fits under GH Releases 2 GiB per-file limit)
        run: |
          mkdir -p release/
          split -b 1700M --suffix-length=2 \
            "${OUTPUT_NAME}" \
            "release/${OUTPUT_NAME}.part-"
          echo "Parts produced:"
          ls -lh release/

      - name: Free the original GGUF (parts are what we ship)
        run: rm "${OUTPUT_NAME}"

      - name: Compute per-part SHA-256
        id: parts
        run: |
          PARTS_JSON='['
          FIRST=1
          for f in release/${OUTPUT_NAME}.part-*; do
            NAME=$(basename "$f")
            SHA=$(sha256sum "$f" | awk '{print $1}')
            SIZE=$(stat -c %s "$f")
            if [ $FIRST -eq 0 ]; then PARTS_JSON+=','; fi
            FIRST=0
            PARTS_JSON+=$(printf '{"name":"%s","sha256":"%s","size_bytes":%d}' "$NAME" "$SHA" "$SIZE")
          done
          PARTS_JSON+=']'
          # Multi-line output for GH Actions
          echo "json<<EOF" >> "$GITHUB_OUTPUT"
          echo "$PARTS_JSON" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

      - name: Assemble manifest.json
        run: |
          cat > release/manifest.json <<MANIFEST
          {
            "name": "${MODEL_ID}",
            "version": "${MODEL_VERSION}",
            "display_name": "Fanar 1.9B (Q4_K_M)",
            "model_family": "fanar",
            "quantization": "Q4_K_M",
            "upstream_repo": "https://huggingface.co/${HF_REPO}",
            "upstream_base_model": "google/gemma-2-9b",
            "language_focus": ["ar", "en"],
            "context_window": 8192,
            "license": "Apache-2.0",
            "license_notes": "Continued pretraining of google/gemma-2-9b; Gemma Terms of Use may apply. See LICENSE.txt in the same release.",
            "release_tag": "${RELEASE_TAG}",
            "release_url": "https://github.com/${{ github.repository }}/releases/tag/${RELEASE_TAG}",
            "final_sha256": "${{ steps.hash.outputs.final_sha256 }}",
            "final_size_bytes": ${{ steps.hash.outputs.final_size }},
            "parts": ${{ steps.parts.outputs.json }},
            "llama_cpp_tag": "${LLAMA_CPP_TAG}",
            "produced_by": "Constellation model-pipeline workflow"
          }
          MANIFEST
          echo "manifest.json:"
          cat release/manifest.json

      - name: Write LICENSE.txt (Apache + Gemma + Fanar citation + redistribution notice)
        run: |
          cat > release/LICENSE.txt <<'LICENSE'
          =========================================================================
          Fanar-1-9B Q4_K_M GGUF (redistributed by Constellation Mind)
          =========================================================================

          Model:         Fanar-1-9B-Instruct (quantized to Q4_K_M)
          Upstream:      https://huggingface.co/QCRI/Fanar-1-9B-Instruct
          Quantization:  Performed by Constellation's model-pipeline workflow
                         from the official QCRI safetensors. Reproducible from
                         .github/workflows/model-pipeline.yml at the commit
                         recorded in this GitHub Release.

          Fanar-1-9B is a continued pretraining of `google/gemma-2-9b`. The
          upstream Gemma Terms of Use may apply to derivatives in addition to
          QCRI's Apache-2.0 declaration. Constellation Mind ships the Gemma
          notices defensively below per Plan §10.5 Q1 (Eisa's lock 2026-05-24).

          =========================================================================
          Apache License 2.0
          =========================================================================

          Full text: https://www.apache.org/licenses/LICENSE-2.0

          Copyright (c) 2025 Qatar Computing Research Institute (QCRI), HBKU.

          Licensed under the Apache License, Version 2.0 (the "License"); you
          may not use this file except in compliance with the License. You may
          obtain a copy of the License at

              https://www.apache.org/licenses/LICENSE-2.0

          Unless required by applicable law or agreed to in writing, software
          distributed under the License is distributed on an "AS IS" BASIS,
          WITHOUT WARRANTIES OR CONDITIONS OF ANY KIND, either express or
          implied. See the License for the specific language governing
          permissions and limitations under the License.

          =========================================================================
          Gemma Terms of Use (upstream — applies on the derivative reading)
          =========================================================================

          Gemma Terms of Use:
              https://ai.google.dev/gemma/terms

          Gemma Prohibited Use Policy:
              https://ai.google.dev/gemma/prohibited_use_policy

          Users of this Fanar redistribution are bound by the Gemma Terms of
          Use and Gemma Prohibited Use Policy in addition to the Apache-2.0
          license above.

          =========================================================================
          Citation
          =========================================================================

          @article{fanar2025,
            title         = {Fanar: An Arabic-Centric Multimodal Generative AI Platform},
            author        = {Fanar Team and Qatar Computing Research Institute and HBKU},
            year          = {2025},
            eprint        = {2501.13944},
            archivePrefix = {arXiv}
          }

          =========================================================================
          Constellation Mind redistribution notice
          =========================================================================

          This Q4_K_M GGUF is a quantization of the upstream Fanar-1-9B-Instruct
          weights, produced by Constellation's release pipeline. The Apache-2.0
          license permits this redistribution provided the license notices
          travel with the weights (§4); this LICENSE.txt is the notice.

          Project:   https://github.com/eisaShamsi/Constellation
          Pipeline:  .github/workflows/model-pipeline.yml
          LICENSE

          echo "LICENSE.txt written:"
          ls -lh release/LICENSE.txt

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: "Model · ${{ inputs.model }} ${{ inputs.version }}"
          body: |
            Constellation Mind model release — produced by the model-pipeline workflow.

            **Model:** `${{ env.MODEL_ID }}`
            **Version:** `${{ env.MODEL_VERSION }}`
            **Quantization:** Q4_K_M (in-house from `${{ env.HF_REPO }}`)
            **Final SHA-256:** `${{ steps.hash.outputs.final_sha256 }}`
            **Final size:** `${{ steps.hash.outputs.final_size }}` bytes
            **llama.cpp pinned:** `${{ env.LLAMA_CPP_TAG }}`

            The GGUF is split into ~1.7 GiB chunks to fit under GitHub Releases'
            2 GiB per-file limit. Constellation's Tauri downloader fetches all
            parts, concatenates, and verifies the final SHA-256 before loading.

            See `manifest.json` for the parts list + per-part hashes; see
            `LICENSE.txt` for Apache-2.0 + Gemma Terms + Fanar citation +
            Constellation redistribution notice.

            Triggered by: @${{ github.actor }}
            Commit:       ${{ github.sha }}
          files: |
            release/manifest.json
            release/LICENSE.txt
            release/${{ env.OUTPUT_NAME }}.part-*
          draft: false
          prerelease: false
          fail_on_unmatched_files: true
