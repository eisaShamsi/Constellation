[package]
name = "constellation"
version = "0.1.0"
description = "A Map of Maps — Unified dashboard for multiple Obsidian vaults"
authors = ["eisaShamsi"]
license = "MIT"
edition = "2021"
repository = "https://github.com/eisaShamsi/Constellation"

[lib]
name = "constellation_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", features = ["json"] }
tokio = { version = "1", features = ["full"] }
rfd = "0.15"
notify = "7"

