[package]
name = "constellation"
version = "0.1.0"
description = "A Universe of Libraries — Desktop knowledge management platform for connected notes"
authors = ["eisaShamsi"]
license = "MIT"
edition = "2021"
repository = "https://github.com/eisaShamsi/Constellation"
# MIG-013 §1A added a second `[[bin]]` target (`build_concept_vectors`),
# which makes Cargo's "default binary for this package" ambiguous. Tauri
# (and `cargo run` without `--bin`) reads `default-run` to disambiguate.
# The Constellation app binary is `src/main.rs` → package name
# `constellation`. The build helper is opt-in via `--bin
# build_concept_vectors`.
default-run = "constellation"

[lib]
name = "constellation_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

# MIG-013 §1A: offline build-time helper that bakes M11's ~20K concept
# vectors into `src/bridge_vectors/data/concept_vectors_v1.bin`. Run once
# per release with:
#     cd src-tauri && cargo run --bin build_concept_vectors --release
# The output asset is committed to the repo and shipped with the binary.
[[bin]]
name = "build_concept_vectors"
path = "build_assets/build_concept_vectors.rs"

# MIG-047 Phase 0b §B — Runtime micro-bench (model-load latency,
# first-token latency, sustained tokens/sec). Run on dev hardware
# with --model <path> after the model-pipeline workflow has produced
# the GGUF + the user has installed it.
[[bin]]
name = "bench_runtime"
path = "build_assets/bench_runtime.rs"

# MIG-047 Phase 0b §H — Tool-use reliability benchmark over a fixed
# prompt suite. Scores tool-call validity, argument fidelity, and
# coherent-reply post-tool-result.
[[bin]]
name = "bench_tool_use"
path = "build_assets/bench_tool_use.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", features = ["json"] }
tokio = { version = "1", features = ["full"] }
# MIG-046 Phase 0a (Constellation Mind): proc macro for `async fn` in
# dyn-compatible traits. Required by `mind::provider::InferenceProvider`
# and `EmbeddingProvider` so the `ChatOrchestrator` (Step D) can hold
# `Arc<dyn InferenceProvider>`. Tiny, zero-runtime-cost; not a "heavy"
# dep in the model-runtime sense the Architect §3 invariant 3 prohibits
# (mistral.rs / llama-cpp-2 / candle — those land in Phase 0b).
# MIT/Apache-2.0 licensed.
async-trait = "0.1"
# MIG-047 Phase 0b §E: SHA-256 + hex for model-install download
# verification. Tiny pure-Rust crates (~50 KB combined); both
# MIT/Apache-2.0; widely used in the Rust ecosystem.
sha2 = "0.10"
hex = "0.4"
# MIG-047 Phase 0b §C-v2 (2026-05-24, after §C-v1 panic): swapped
# mistral.rs → llama-cpp-2 for the LocalProvider runtime.
#
# Why the swap: mistral.rs 0.8.1's GGUF loader does NOT include a
# `gemma2` architecture handler; it panics at first model load
# (mistralrs-core/src/gguf/content.rs:151 — "Unknown GGUF architecture
# `gemma2`"). The README's Gemma 2 listing is the safetensors path,
# not the GGUF path. Fanar's quantized GGUF advertises gemma2, so it
# never loads. llama-cpp-2 wraps upstream llama.cpp which has full
# Gemma 2 GGUF support (the same llama.cpp that quantized Fanar in
# our model-pipeline workflow). Eisa's revised lock (Path A): take
# the cmake/MSVC risk now rather than deferring to Phase 2.5 — gives
# us a single runtime for both Fanar (now) and Jais (Phase 2.5).
#
# Windows MSVC build: requires cmake on PATH at build time. cmake
# lives at `C:\Program Files (x86)\Microsoft Visual Studio\18\BuildTools\
# Common7\IDE\CommonExtensions\Microsoft\CMake\CMake\bin\cmake.exe`
# (VS Build Tools 18). Cargo invocations from this repo must prepend
# that dir to PATH.
#
# MIT/Apache-2.0 licensed. utilityai/llama-cpp-rs is the upstream.
llama-cpp-2 = "0.1.146"
rfd = "0.15"
notify = "7"
regex = "1"
petgraph = "0.6"
rusqlite = { version = "0.31", features = ["bundled"] }
ort = "2.0.0-rc.12"
tokenizers = { version = "0.20", default-features = false, features = ["onig"] }
# MIG-012-fix-9: parallel data work (vocab population, future bulk
# tokenization passes). rayon is already a transitive dep via tokenizers;
# adding it directly so we can `use rayon::prelude::*`.
rayon = "1"
chrono = "0.4"
rand = "0.8"
# MIG-021v3 V3-§8.r4 (audit P1.2): cross-platform atomic file rename for
# the per-Library cataloger_reliability.json. std::fs::rename to an
# existing target is non-atomic on Windows pre-NTFS-fixup; tempfile's
# NamedTempFile::persist handles the platform difference correctly.
tempfile = "3"
# MIG-021v3 V3-§8.r4 (audit P1.7): NFKC Unicode normalization for the
# Linguistic Cataloger surface-token lookup. Without it, Cyrillic /
# Persian / Urdu look-alike codepoints silently bypass the lexicon.
unicode-normalization = "0.1"
# MIG-040 (NSC): Unicode UAX #29 sentence segmentation for the Note Summary
# Creator's language-agnostic sentence splitter (CJK / Arabic / Indic). The
# proven cross-language standard; pure-Rust, MIT/Apache-2.0.
unicode-segmentation = "1"
tauri-plugin-updater = "2.10.0"
tauri-plugin-process = "2.3.1"
# M3: compact, read-only morphological index. BurntSushi's `fst` crate —
# pure-Rust FST (finite-state transducer) over UTF-8 keys with u64 values.
# Used by arabic::fst_index to replace the HashMap-backed GenerativeIndex.
# BSD/MIT licensed (license-clean, matches our no-GPL policy).
fst = "0.4"
# M3-baker: cross-platform cache directory resolution (Windows
# `%LOCALAPPDATA%`, macOS `~/Library/Caches`, Linux `~/.cache`).
# Used by arabic::fst_bake to persist the compiled FST between launches.
# Apache-2.0/MIT licensed.
dirs = "5"
# M9-hotpath (b): inline small-vector storage for the analyzer's
# `Vec<Analysis>` hot path. Already in the dep tree transitively (via
# rusqlite / hashbrown); promoting to a direct dep so the analyzer can
# name the type. MIT/Apache-2.0 licensed.
smallvec = "1"

# M9-mmap: memory-map the baked Arabic FST byte buffers so they live
# in the OS page cache rather than the process heap. Applied only on
# desktop targets — iOS and Android sandboxes routinely deny anonymous
# mmap. On those targets `fst_bake` falls back to `Vec<u8>` (the old
# heap-resident path). MIT/Apache-2.0 licensed.
[target.'cfg(not(any(target_os = "ios", target_os = "android")))'.dependencies]
memmap2 = "0.9"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
protocol-asset = ["tauri/protocol-asset"]

