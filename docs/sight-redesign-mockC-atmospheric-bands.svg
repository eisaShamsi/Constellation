<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" font-family="Inter, system-ui, sans-serif">
  <!--
    Sight redesign · Mock C · Atmospheric Bands
    ────────────────────────────────────────────
    Philosophy: trust the metaphor. Strata get translucent atmospheric
    color (warm core → cool periphery), and lens channels appear as
    star aurora — outer halo rings, core temperature, spike patterns.
    No toggles, no isolation. The dome is read like a cosmic photograph.
    Most cinematic, most metaphor-heavy.
  -->

  <defs>
    <radialGradient id="C-bg" cx="50%" cy="55%" r="60%">
      <stop offset="0%"   stop-color="#0a1832" stop-opacity="1"/>
      <stop offset="100%" stop-color="#04080f" stop-opacity="1"/>
    </radialGradient>

    <!-- stratum band atmosphere (5 zones, warm-to-cool, inner → outer) -->
    <radialGradient id="C-strat-foundation" cx="50%" cy="50%" r="50%">
      <stop offset="0%"   stop-color="#ff6b35" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#ff6b35" stop-opacity="0.05"/>
    </radialGradient>
    <radialGradient id="C-strat-working" cx="50%" cy="50%" r="50%">
      <stop offset="0%"   stop-color="#ff9e44" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#ff9e44" stop-opacity="0.03"/>
    </radialGradient>
    <radialGradient id="C-strat-connection" cx="50%" cy="50%" r="50%">
      <stop offset="0%"   stop-color="#4cc9f0" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#4cc9f0" stop-opacity="0.02"/>
    </radialGradient>
    <radialGradient id="C-strat-synthesis" cx="50%" cy="50%" r="50%">
      <stop offset="0%"   stop-color="#9552c8" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#9552c8" stop-opacity="0.03"/>
    </radialGradient>
    <radialGradient id="C-strat-edge" cx="50%" cy="50%" r="50%">
      <stop offset="0%"   stop-color="#dcb4ff" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#dcb4ff" stop-opacity="0.02"/>
    </radialGradient>

    <!-- star aurora gradients (per library) -->
    <radialGradient id="C-aurora1" cx="50%" cy="50%" r="50%">
      <stop offset="20%" stop-color="#7dd3fc" stop-opacity="0.9"/>
      <stop offset="60%" stop-color="#7dd3fc" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#7dd3fc" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="C-aurora2" cx="50%" cy="50%" r="50%">
      <stop offset="20%" stop-color="#fda4af" stop-opacity="0.9"/>
      <stop offset="60%" stop-color="#fda4af" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#fda4af" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="C-aurora3" cx="50%" cy="50%" r="50%">
      <stop offset="20%" stop-color="#fde68a" stop-opacity="0.9"/>
      <stop offset="60%" stop-color="#fde68a" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#fde68a" stop-opacity="0"/>
    </radialGradient>

    <filter id="C-glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2.5"/>
    </filter>
  </defs>

  <!-- gradient background -->
  <rect width="1200" height="800" fill="url(#C-bg)"/>

  <!-- title block -->
  <text x="600" y="42" fill="#e8ebf2" font-size="20" text-anchor="middle" font-weight="500" letter-spacing="0.5">Constellation Sight</text>
  <text x="600" y="64" fill="#8c95a8" font-size="11" text-anchor="middle">My Universe · 7,636 notes · 2,041 links · 5 libraries</text>
  <text x="600" y="80" fill="#5a6275" font-size="9"  text-anchor="middle">Mock C · Atmospheric Bands</text>

  <!-- stratum atmospheric bands (5 nested filled circles, outer to inner so inner draws on top) -->
  <g>
    <circle cx="600" cy="450" r="320" fill="url(#C-strat-edge)"/>
    <circle cx="600" cy="450" r="256" fill="url(#C-strat-synthesis)"/>
    <circle cx="600" cy="450" r="192" fill="url(#C-strat-connection)"/>
    <circle cx="600" cy="450" r="128" fill="url(#C-strat-working)"/>
    <circle cx="600" cy="450" r="64"  fill="url(#C-strat-foundation)"/>
  </g>

  <!-- faint stratum guide rings (so the bands have edges) -->
  <g fill="none" stroke="#1a1f2e" stroke-width="0.4" opacity="0.7">
    <circle cx="600" cy="450" r="64"/>
    <circle cx="600" cy="450" r="128"/>
    <circle cx="600" cy="450" r="192"/>
    <circle cx="600" cy="450" r="256"/>
    <circle cx="600" cy="450" r="320"/>
  </g>

  <!-- calendar rim -->
  <g fill="#6a7390" font-size="10" text-anchor="middle">
    <text x="600" y="120">JAN</text>
    <text x="770" y="155">FEB</text>
    <text x="894" y="260">MAR</text>
    <text x="940" y="404">APR</text>
    <text x="940" y="498">MAY</text>
    <text x="894" y="640">JUN</text>
    <text x="770" y="745">JUL</text>
    <text x="600" y="780">AUG</text>
    <text x="430" y="745">SEP</text>
    <text x="306" y="640">OCT</text>
    <text x="260" y="498">NOV</text>
    <text x="260" y="404">DEC</text>
  </g>

  <!-- constellation lines (subtle glowing arcs) -->
  <g fill="none" stroke-width="0.7" opacity="0.7" filter="url(#C-glow)">
    <path d="M 595 410 Q 605 395 615 410" stroke="#4ade80"/>
    <path d="M 580 420 L 595 410" stroke="#4ade80"/>
    <path d="M 640 330 Q 680 310 720 340" stroke="#fb923c"/>
    <path d="M 720 340 L 750 320" stroke="#fb923c"/>
    <path d="M 550 165 Q 590 145 630 165" stroke="#60a5fa"/>
    <path d="M 595 410 Q 700 280 800 220" stroke="#a78bfa" opacity="0.5"/>
    <path d="M 770 470 L 800 460" stroke="#22d3ee"/>
    <path d="M 800 460 Q 820 450 815 480" stroke="#22d3ee"/>
    <path d="M 540 350 L 580 360" stroke="#f87171" stroke-dasharray="2 2"/>
  </g>

  <!-- stars with aurora glow halos -->
  <g>
    <!-- foundation cluster -->
    <g transform="translate(595, 410)">
      <circle r="9" fill="url(#C-aurora1)"/>
      <circle r="3" fill="#7dd3fc"/>
      <circle r="1.2" fill="#4ade80"/>
    </g>
    <g transform="translate(605, 405)">
      <circle r="8" fill="url(#C-aurora1)"/>
      <circle r="2.8" fill="#7dd3fc" opacity="0.92"/>
      <circle r="1" fill="#22d3ee"/>
    </g>
    <g transform="translate(615, 410)">
      <circle r="9" fill="url(#C-aurora2)"/>
      <circle r="3" fill="#fda4af"/>
      <circle r="1.1" fill="#4ade80"/>
    </g>
    <g transform="translate(580, 420)">
      <circle r="7" fill="url(#C-aurora1)" opacity="0.8"/>
      <circle r="2.5" fill="#7dd3fc" opacity="0.8"/>
      <circle r="1" fill="#facc15"/>
    </g>
    <g transform="translate(620, 435)">
      <circle r="7" fill="url(#C-aurora3)" opacity="0.75"/>
      <circle r="2.4" fill="#fde68a" opacity="0.78"/>
      <circle r="0.9" fill="#4ade80"/>
    </g>

    <!-- working -->
    <g transform="translate(640, 330)">
      <circle r="8" fill="url(#C-aurora2)"/>
      <circle r="2.8" fill="#fda4af" opacity="0.9"/>
      <circle r="1" fill="#22d3ee"/>
    </g>
    <g transform="translate(680, 320)">
      <circle r="7" fill="url(#C-aurora1)" opacity="0.85"/>
      <circle r="2.5" fill="#7dd3fc" opacity="0.85"/>
      <circle r="1" fill="#a78bfa"/>
    </g>
    <g transform="translate(720, 340)">
      <circle r="8.5" fill="url(#C-aurora3)"/>
      <circle r="3" fill="#fde68a"/>
      <circle r="1.1" fill="#4ade80"/>
    </g>
    <g transform="translate(750, 320)">
      <circle r="6" fill="url(#C-aurora1)" opacity="0.65"/>
      <circle r="2" fill="#7dd3fc" opacity="0.65"/>
      <circle r="0.8" fill="#facc15"/>
    </g>

    <!-- connection -->
    <g transform="translate(550, 280)">
      <circle r="7" fill="url(#C-aurora2)" opacity="0.78"/>
      <circle r="2.5" fill="#fda4af" opacity="0.78"/>
      <circle r="0.9" fill="#22d3ee"/>
    </g>
    <g transform="translate(650, 270)">
      <circle r="6.5" fill="url(#C-aurora1)" opacity="0.75"/>
      <circle r="2.3" fill="#7dd3fc" opacity="0.75"/>
      <circle r="0.9" fill="#a78bfa"/>
    </g>
    <g transform="translate(700, 260)">
      <circle r="6" fill="url(#C-aurora3)" opacity="0.7"/>
      <circle r="2.1" fill="#fde68a" opacity="0.7"/>
      <circle r="0.8" fill="#22d3ee"/>
    </g>

    <!-- synthesis -->
    <g transform="translate(580, 215)">
      <circle r="5.5" fill="url(#C-aurora3)" opacity="0.6"/>
      <circle r="1.9" fill="#fde68a" opacity="0.65"/>
      <circle r="0.8" fill="#facc15"/>
    </g>
    <g transform="translate(650, 210)">
      <circle r="7" fill="url(#C-aurora1)" opacity="0.85"/>
      <circle r="2.4" fill="#7dd3fc" opacity="0.88"/>
      <circle r="1" fill="#22d3ee"/>
    </g>

    <!-- edge of knowing (sparse, faded aurora) -->
    <g transform="translate(595, 160)">
      <circle r="4.5" fill="url(#C-aurora2)" opacity="0.45"/>
      <circle r="1.5" fill="#fda4af" opacity="0.5"/>
      <circle r="0.7" fill="#a78bfa"/>
    </g>
    <g transform="translate(630, 170)">
      <circle r="4" fill="url(#C-aurora1)" opacity="0.35"/>
      <circle r="1.3" fill="#7dd3fc" opacity="0.4"/>
      <circle r="0.6" fill="#94a3b8"/>
    </g>

    <!-- right cluster -->
    <g transform="translate(770, 470)">
      <circle r="7.5" fill="url(#C-aurora3)" opacity="0.85"/>
      <circle r="2.7" fill="#fde68a" opacity="0.85"/>
      <circle r="1" fill="#4ade80"/>
    </g>
    <g transform="translate(800, 460)">
      <circle r="6.5" fill="url(#C-aurora3)" opacity="0.78"/>
      <circle r="2.3" fill="#fde68a" opacity="0.78"/>
      <circle r="0.9" fill="#22d3ee"/>
    </g>
    <g transform="translate(815, 480)">
      <circle r="6" fill="url(#C-aurora1)" opacity="0.7"/>
      <circle r="2.1" fill="#7dd3fc" opacity="0.7"/>
      <circle r="0.8" fill="#a78bfa"/>
    </g>

    <!-- left cluster -->
    <g transform="translate(470, 470)">
      <circle r="7" fill="url(#C-aurora2)" opacity="0.82"/>
      <circle r="2.5" fill="#fda4af" opacity="0.82"/>
      <circle r="0.9" fill="#facc15"/>
    </g>
    <g transform="translate(440, 460)">
      <circle r="6.5" fill="url(#C-aurora2)" opacity="0.75"/>
      <circle r="2.3" fill="#fda4af" opacity="0.75"/>
      <circle r="0.9" fill="#22d3ee"/>
    </g>
    <g transform="translate(405, 465)">
      <circle r="5.5" fill="url(#C-aurora1)" opacity="0.65"/>
      <circle r="1.9" fill="#7dd3fc" opacity="0.7"/>
      <circle r="0.8" fill="#94a3b8"/>
    </g>

    <!-- bottom curve -->
    <g transform="translate(540, 350)">
      <circle r="7.5" fill="url(#C-aurora1)" opacity="0.85"/>
      <circle r="2.7" fill="#7dd3fc" opacity="0.85"/>
      <circle r="1" fill="#a78bfa"/>
    </g>
    <g transform="translate(620, 720)">
      <circle r="8" fill="url(#C-aurora1)" opacity="0.9"/>
      <circle r="2.9" fill="#7dd3fc"/>
      <circle r="1" fill="#4ade80"/>
    </g>
    <g transform="translate(640, 700)">
      <circle r="7" fill="url(#C-aurora3)" opacity="0.82"/>
      <circle r="2.5" fill="#fde68a" opacity="0.85"/>
      <circle r="1" fill="#22d3ee"/>
    </g>
    <g transform="translate(580, 700)">
      <circle r="6" fill="url(#C-aurora2)" opacity="0.75"/>
      <circle r="2.1" fill="#fda4af" opacity="0.78"/>
      <circle r="0.9" fill="#facc15"/>
    </g>

    <!-- diagnostic orphans -->
    <g transform="translate(380, 200)">
      <circle r="3.5" fill="url(#C-aurora3)" opacity="0.3"/>
      <circle r="1.2" fill="#fde68a" opacity="0.4"/>
      <circle r="0.5" fill="#94a3b8"/>
    </g>
    <g transform="translate(870, 230)">
      <circle r="3.5" fill="url(#C-aurora2)" opacity="0.3"/>
      <circle r="1.2" fill="#fda4af" opacity="0.4"/>
      <circle r="0.5" fill="#94a3b8"/>
    </g>
  </g>

  <!-- right-edge atmospheric legend (vertical) -->
  <g transform="translate(1050, 200)" font-size="10" fill="#8c95a8">
    <text fill="#a0aabe" font-weight="500" font-size="11" letter-spacing="0.6">ATMOSPHERE</text>

    <g transform="translate(0, 28)">
      <rect width="14" height="14" rx="2" fill="#ff6b35" opacity="0.4"/>
      <text x="22" y="11" fill="#cdd5e0">Foundation</text>
    </g>
    <g transform="translate(0, 52)">
      <rect width="14" height="14" rx="2" fill="#ff9e44" opacity="0.4"/>
      <text x="22" y="11" fill="#cdd5e0">Working knowledge</text>
    </g>
    <g transform="translate(0, 76)">
      <rect width="14" height="14" rx="2" fill="#4cc9f0" opacity="0.4"/>
      <text x="22" y="11" fill="#cdd5e0">Connection layer</text>
    </g>
    <g transform="translate(0, 100)">
      <rect width="14" height="14" rx="2" fill="#9552c8" opacity="0.4"/>
      <text x="22" y="11" fill="#cdd5e0">Synthesis</text>
    </g>
    <g transform="translate(0, 124)">
      <rect width="14" height="14" rx="2" fill="#dcb4ff" opacity="0.4"/>
      <text x="22" y="11" fill="#cdd5e0">Edge of knowing</text>
    </g>

    <text x="0" y="172" fill="#a0aabe" font-weight="500" font-size="11" letter-spacing="0.6">STAR AURORA</text>
    <text x="0" y="196" fill="#cdd5e0">tint = library</text>
    <text x="0" y="216" fill="#cdd5e0">brightness = confidence</text>
    <text x="0" y="236" fill="#cdd5e0">core pip = stage</text>
    <text x="0" y="256" fill="#cdd5e0">glow ring = recent acts</text>
    <text x="0" y="276" fill="#cdd5e0">arcs = typed links</text>
  </g>

  <!-- diagnostic summary (top-right, atmospheric style) -->
  <g transform="translate(1170, 100)" font-size="10" fill="#8c95a8" text-anchor="end">
    <text fill="#a0aabe" font-weight="500">universe state</text>
    <text y="18">healthy · 64%</text>
    <text y="32">at-risk · 28%</text>
    <text y="46">dormant · 8%</text>
  </g>
</svg>
