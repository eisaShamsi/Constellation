<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" font-family="Inter, system-ui, sans-serif">
  <!--
    Sight redesign · v0.2 · Mock D · Coordinated Views (NEW — DataViz SME proposal)
    ─────────────────────────────────────────────────────────────────────────────
    Philosophy: small-multiples idiom (Tufte + Vega-Lite/Plot). One large anchor
    dome on the left (stratum × time × library shape), four mini-domes on the
    right, each isolating one lens with its optimal channel. Linked brushing.
  -->

  <!-- background -->
  <rect width="1200" height="800" fill="#080c16"/>

  <!-- title -->
  <text x="600" y="38" fill="#e8ebf2" font-size="20" text-anchor="middle" font-weight="500" letter-spacing="0.5">Constellation Sight</text>
  <text x="600" y="60" fill="#5a6370" font-size="11" text-anchor="middle">My Universe · 7,636 notes · 2,041 links · Mock D · Coordinated Views · v0.2</text>

  <!-- ============== LEFT: ANCHOR DOME (stratum × time × library shape × links) ============== -->
  <g transform="translate(0, 0)">
    <text x="340" y="98" fill="#7dd3fc" font-size="11" text-anchor="middle" font-weight="500" letter-spacing="0.5">ANCHOR — stratum × time × library</text>

    <!-- strata circles -->
    <g fill="none" stroke="#1a1f2e" stroke-width="0.6">
      <circle cx="340" cy="450" r="55"/>
      <circle cx="340" cy="450" r="110"/>
      <circle cx="340" cy="450" r="165"/>
      <circle cx="340" cy="450" r="220"/>
      <circle cx="340" cy="450" r="275"/>
    </g>

    <!-- calendar rim (compact) -->
    <g fill="#3e4453" font-size="9" text-anchor="middle">
      <text x="340" y="160">JAN</text>
      <text x="490" y="195">FEB</text>
      <text x="590" y="290">MAR</text>
      <text x="628" y="412">APR</text>
      <text x="628" y="492">MAY</text>
      <text x="590" y="614">JUN</text>
      <text x="490" y="708">JUL</text>
      <text x="340" y="740">AUG</text>
      <text x="190" y="708">SEP</text>
      <text x="90" y="614">OCT</text>
      <text x="52" y="492">NOV</text>
      <text x="52" y="412">DEC</text>
    </g>

    <!-- constellation lines -->
    <g fill="none" stroke-width="0.55" opacity="0.55">
      <path d="M 335 410 Q 345 395 355 410" stroke="#4ade80"/>
      <path d="M 320 420 L 335 410" stroke="#4ade80"/>
      <path d="M 380 330 Q 420 310 460 340" stroke="#fb923c"/>
      <path d="M 290 280 Q 330 260 370 280" stroke="#60a5fa"/>
      <path d="M 460 470 L 490 460" stroke="#22d3ee"/>
      <path d="M 210 470 L 180 460" stroke="#f472b6"/>
    </g>

    <!-- stars (anchor: shape=library, opacity=conf, pip=stage, size=acts) -->
    <g>
      <g transform="translate(335, 410)" opacity="0.95"><circle r="4" fill="#7dd3fc"/><circle r="1.1" fill="#4ade80"/></g>
      <g transform="translate(345, 405)" opacity="0.85"><circle r="4" fill="#7dd3fc"/><circle r="1.1" fill="#22d3ee"/></g>
      <g transform="translate(355, 410)" opacity="0.9"><rect x="-4" y="-4" width="8" height="8" fill="#fda4af"/><circle r="1.1" fill="#4ade80"/></g>
      <g transform="translate(320, 420)" opacity="0.75"><circle r="4" fill="#7dd3fc"/><circle r="1" fill="#facc15"/></g>
      <g transform="translate(380, 330)" opacity="0.88"><rect x="-4" y="-4" width="8" height="8" fill="#fda4af"/><circle r="1.1" fill="#22d3ee"/></g>
      <g transform="translate(420, 320)" opacity="0.8"><circle r="4" fill="#7dd3fc"/><circle r="1.1" fill="#a78bfa"/></g>
      <!-- HIGHLIGHTED star for linked brushing demo -->
      <g transform="translate(460, 340)" opacity="1">
        <circle r="9" fill="none" stroke="#fbbf24" stroke-width="1.5"/>
        <rect x="-5.2" y="-5.2" width="10.4" height="10.4" fill="#fde68a" transform="rotate(45)"/>
        <circle r="1.4" fill="#4ade80"/>
      </g>
      <g transform="translate(290, 280)" opacity="0.78"><rect x="-4" y="-4" width="8" height="8" fill="#fda4af"/><circle r="1.1" fill="#22d3ee"/></g>
      <g transform="translate(370, 280)" opacity="0.72"><circle r="3.8" fill="#7dd3fc"/><circle r="1" fill="#a78bfa"/></g>
      <g transform="translate(330, 215)" opacity="0.6"><rect x="-3.5" y="-3.5" width="7" height="7" fill="#fde68a" transform="rotate(45)"/><circle r="0.9" fill="#facc15"/></g>
      <g transform="translate(390, 210)" opacity="0.85"><circle r="4" fill="#7dd3fc"/><circle r="1.1" fill="#22d3ee"/></g>
      <g transform="translate(335, 190)" opacity="0.5"><rect x="-3.5" y="-3.5" width="7" height="7" fill="#fda4af"/><circle r="0.9" fill="#a78bfa"/></g>
      <g transform="translate(460, 470)" opacity="0.85"><rect x="-5.2" y="-5.2" width="10.4" height="10.4" fill="#fde68a" transform="rotate(45)"/><circle r="1.4" fill="#4ade80"/></g>
      <g transform="translate(490, 460)" opacity="0.78"><rect x="-3.5" y="-3.5" width="7" height="7" fill="#fde68a" transform="rotate(45)"/><circle r="1" fill="#22d3ee"/></g>
      <g transform="translate(210, 470)" opacity="0.82"><rect x="-4" y="-4" width="8" height="8" fill="#fda4af"/><circle r="1.1" fill="#facc15"/></g>
      <g transform="translate(180, 460)" opacity="0.75"><rect x="-3.5" y="-3.5" width="7" height="7" fill="#fda4af"/><circle r="0.9" fill="#22d3ee"/></g>
      <g transform="translate(340, 660)" opacity="0.9"><circle r="4" fill="#7dd3fc"/><circle r="1.1" fill="#4ade80"/></g>
    </g>
  </g>

  <!-- ========= DIVIDER ========= -->
  <line x1="700" y1="105" x2="700" y2="730" stroke="#1a1f2e" stroke-width="1"/>

  <!-- ============== RIGHT: 4 MINI-DOMES (2x2 grid) ============== -->

  <!-- mini 1: CONFIDENCE (top-left) -->
  <g transform="translate(720, 110)">
    <text x="120" y="14" fill="#a0aabe" font-size="10" text-anchor="middle" font-weight="500" letter-spacing="0.5">CONFIDENCE — opacity only</text>
    <g fill="none" stroke="#1a1f2e" stroke-width="0.4">
      <circle cx="120" cy="130" r="22"/>
      <circle cx="120" cy="130" r="44"/>
      <circle cx="120" cy="130" r="66"/>
      <circle cx="120" cy="130" r="88"/>
      <circle cx="120" cy="130" r="110"/>
    </g>
    <!-- stars: all rendered same hue (#7dd3fc), only opacity varies -->
    <g fill="#7dd3fc">
      <circle cx="118" cy="118" r="2.8" opacity="0.95"/>
      <circle cx="124" cy="120" r="2.8" opacity="0.85"/>
      <circle cx="130" cy="115" r="2.8" opacity="0.9"/>
      <circle cx="110" cy="125" r="2.8" opacity="0.75"/>
      <circle cx="135" cy="135" r="2.8" opacity="0.7"/>
      <circle cx="155" cy="100" r="2.8" opacity="0.88"/>
      <circle cx="170" cy="95" r="2.8" opacity="0.8"/>
      <!-- HIGHLIGHTED star, same as anchor -->
      <circle cx="180" cy="105" r="3.6" opacity="1" stroke="#fbbf24" stroke-width="1.2" fill="#fde68a"/>
      <circle cx="80" cy="100" r="2.8" opacity="0.78"/>
      <circle cx="95" cy="80" r="2.8" opacity="0.72"/>
      <circle cx="115" cy="60" r="2.5" opacity="0.6"/>
      <circle cx="140" cy="55" r="2.5" opacity="0.85"/>
      <circle cx="125" cy="35" r="2.2" opacity="0.5"/>
      <circle cx="190" cy="160" r="2.8" opacity="0.85"/>
      <circle cx="200" cy="155" r="2.5" opacity="0.78"/>
      <circle cx="55" cy="160" r="2.8" opacity="0.82"/>
      <circle cx="40" cy="155" r="2.5" opacity="0.75"/>
      <circle cx="115" cy="205" r="2.8" opacity="0.9"/>
    </g>
  </g>

  <!-- mini 2: STAGE (top-right) -->
  <g transform="translate(960, 110)">
    <text x="120" y="14" fill="#a0aabe" font-size="10" text-anchor="middle" font-weight="500" letter-spacing="0.5">STAGE — hue only</text>
    <g fill="none" stroke="#1a1f2e" stroke-width="0.4">
      <circle cx="120" cy="130" r="22"/>
      <circle cx="120" cy="130" r="44"/>
      <circle cx="120" cy="130" r="66"/>
      <circle cx="120" cy="130" r="88"/>
      <circle cx="120" cy="130" r="110"/>
    </g>
    <!-- larger pips, full opacity, hue carries stage -->
    <g>
      <circle cx="118" cy="118" r="2.8" fill="#4ade80"/>
      <circle cx="124" cy="120" r="2.8" fill="#22d3ee"/>
      <circle cx="130" cy="115" r="2.8" fill="#4ade80"/>
      <circle cx="110" cy="125" r="2.8" fill="#facc15"/>
      <circle cx="135" cy="135" r="2.8" fill="#4ade80"/>
      <circle cx="155" cy="100" r="2.8" fill="#22d3ee"/>
      <circle cx="170" cy="95" r="2.8" fill="#a78bfa"/>
      <!-- HIGHLIGHTED -->
      <circle cx="180" cy="105" r="3.6" fill="#4ade80" stroke="#fbbf24" stroke-width="1.2"/>
      <circle cx="80" cy="100" r="2.8" fill="#22d3ee"/>
      <circle cx="95" cy="80" r="2.8" fill="#a78bfa"/>
      <circle cx="115" cy="60" r="2.5" fill="#facc15"/>
      <circle cx="140" cy="55" r="2.5" fill="#22d3ee"/>
      <circle cx="125" cy="35" r="2.2" fill="#94a3b8"/>
      <circle cx="190" cy="160" r="2.8" fill="#4ade80"/>
      <circle cx="200" cy="155" r="2.5" fill="#22d3ee"/>
      <circle cx="55" cy="160" r="2.8" fill="#facc15"/>
      <circle cx="40" cy="155" r="2.5" fill="#22d3ee"/>
      <circle cx="115" cy="205" r="2.8" fill="#4ade80"/>
    </g>
  </g>

  <!-- mini 3: ACTS (bottom-left) -->
  <g transform="translate(720, 430)">
    <text x="120" y="14" fill="#a0aabe" font-size="10" text-anchor="middle" font-weight="500" letter-spacing="0.5">ACTS — size only (top decile)</text>
    <g fill="none" stroke="#1a1f2e" stroke-width="0.4">
      <circle cx="120" cy="130" r="22"/>
      <circle cx="120" cy="130" r="44"/>
      <circle cx="120" cy="130" r="66"/>
      <circle cx="120" cy="130" r="88"/>
      <circle cx="120" cy="130" r="110"/>
    </g>
    <!-- binary: small dot OR large dot for top decile -->
    <g fill="#cdd5e0">
      <circle cx="118" cy="118" r="1.2"/>
      <circle cx="124" cy="120" r="1.2"/>
      <circle cx="130" cy="115" r="1.2"/>
      <circle cx="110" cy="125" r="1.2"/>
      <circle cx="135" cy="135" r="1.2"/>
      <circle cx="155" cy="100" r="1.2"/>
      <circle cx="170" cy="95" r="1.2"/>
      <!-- top decile: large + highlighted -->
      <circle cx="180" cy="105" r="5" fill="#fbbf24" stroke="#fbbf24" stroke-width="1.2"/>
      <circle cx="80" cy="100" r="1.2"/>
      <circle cx="95" cy="80" r="1.2"/>
      <circle cx="115" cy="60" r="1.2"/>
      <!-- another top-decile -->
      <circle cx="140" cy="55" r="4.5" fill="#cdd5e0"/>
      <circle cx="125" cy="35" r="1"/>
      <!-- another top-decile -->
      <circle cx="190" cy="160" r="4.5" fill="#cdd5e0"/>
      <circle cx="200" cy="155" r="1"/>
      <circle cx="55" cy="160" r="1.2"/>
      <circle cx="40" cy="155" r="1"/>
      <circle cx="115" cy="205" r="1.2"/>
    </g>
  </g>

  <!-- mini 4: PROVENANCE (bottom-right) -->
  <g transform="translate(960, 430)">
    <text x="120" y="14" fill="#a0aabe" font-size="10" text-anchor="middle" font-weight="500" letter-spacing="0.5">PROVENANCE — 5 source sectors</text>
    <!-- 5 colored sector wedges -->
    <g>
      <path d="M 120 130 L 120 20 A 110 110 0 0 1 224.6 100.6 Z" fill="#7dd3fc" opacity="0.18"/>     <!-- Self -->
      <path d="M 120 130 L 224.6 100.6 A 110 110 0 0 1 224.6 159.4 Z" fill="#fda4af" opacity="0.18"/> <!-- Read -->
      <path d="M 120 130 L 224.6 159.4 A 110 110 0 0 1 120 240 Z" fill="#fde68a" opacity="0.18"/>    <!-- Heard -->
      <path d="M 120 130 L 120 240 A 110 110 0 0 1 15.4 159.4 Z" fill="#a78bfa" opacity="0.18"/>     <!-- Reasoned -->
      <path d="M 120 130 L 15.4 159.4 A 110 110 0 0 1 120 20 Z" fill="#4ade80" opacity="0.18"/>      <!-- Tradition -->
    </g>
    <!-- sector labels -->
    <g font-size="9" fill="#a0aabe" text-anchor="middle">
      <text x="155" y="55">Self</text>
      <text x="200" y="135">Read</text>
      <text x="155" y="215">Heard</text>
      <text x="55" y="215">Reasoned</text>
      <text x="55" y="55">Tradition</text>
    </g>
    <!-- stars positioned in their sector -->
    <g>
      <circle cx="155" cy="80" r="2.4" fill="#cdd5e0"/>
      <circle cx="160" cy="90" r="2.4" fill="#cdd5e0"/>
      <circle cx="190" cy="130" r="2.4" fill="#cdd5e0"/>
      <circle cx="200" cy="145" r="2.4" fill="#cdd5e0"/>
      <circle cx="150" cy="200" r="2.4" fill="#cdd5e0"/>
      <circle cx="70" cy="180" r="2.4" fill="#cdd5e0"/>
      <circle cx="80" cy="200" r="2.4" fill="#cdd5e0"/>
      <circle cx="90" cy="75" r="2.4" fill="#cdd5e0"/>
      <circle cx="110" cy="60" r="2.4" fill="#cdd5e0"/>
      <!-- HIGHLIGHTED — in the Read sector (this note came from a book) -->
      <circle cx="195" cy="105" r="3.6" fill="#fde68a" stroke="#fbbf24" stroke-width="1.2"/>
    </g>
  </g>

  <!-- linked-brushing hint -->
  <g transform="translate(960, 700)" font-size="9" fill="#fbbf24" text-anchor="middle">
    <text>hovered star appears highlighted across all 5 views</text>
  </g>

  <!-- gesture hint at bottom -->
  <g transform="translate(600, 770)" font-size="9" fill="#3a4150" text-anchor="middle">
    <text>hover any view to brush · click a star to open the note · gestures from §3 apply to anchor dome</text>
  </g>
</svg>
