<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" font-family="Inter, system-ui, sans-serif">
  <!--
    Sight redesign · v0.2 · Mock C · Subtle Bands (revised from Atmospheric Bands)
    ──────────────────────────────────────────────────────────────────────────────
    v0.2 changes from v0.1 Atmospheric Bands:
      • Stratum tint reduced from 0.18 → 0.06 opacity (panel recommendation).
      • Warm-to-cool ramp REMOVED. Replaced with luminance-monotonic gray ramp
        (Cross-Civ SME's specific fix — no cultural-payload temperature).
      • Aurora glow REMOVED (DataViz performance + Tufte data-ink critiques).
      • Stars use v0.2 channel encoding (shape for library, opacity, hue, size).
      • Atmosphere is the redundant coding for stratum (position + value);
        cultural neutrality preserved.
  -->

  <defs>
    <radialGradient id="C-bg" cx="50%" cy="55%" r="60%">
      <stop offset="0%"   stop-color="#0a0e1a" stop-opacity="1"/>
      <stop offset="100%" stop-color="#04080f" stop-opacity="1"/>
    </radialGradient>
  </defs>

  <!-- gradient background (very mild) -->
  <rect width="1200" height="800" fill="url(#C-bg)"/>

  <!-- title block -->
  <text x="600" y="42" fill="#e8ebf2" font-size="20" text-anchor="middle" font-weight="500" letter-spacing="0.5">Constellation Sight</text>
  <text x="600" y="64" fill="#5a6370" font-size="11" text-anchor="middle">My Universe · 7,636 notes · 2,041 links</text>
  <text x="600" y="80" fill="#3a4150" font-size="9" text-anchor="middle">Mock C · Subtle Bands · v0.2</text>

  <!--
    Stratum bands — luminance-monotonic gray ramp, 0.06 opacity.
    Inner (Foundation) = slightly lighter; outer (Edge of Knowing) = slightly darker.
    Pure value gradient, no hue commitments.
  -->
  <g>
    <circle cx="600" cy="450" r="320" fill="#5a6275" opacity="0.05"/>
    <circle cx="600" cy="450" r="256" fill="#6a7285" opacity="0.05"/>
    <circle cx="600" cy="450" r="192" fill="#7a8295" opacity="0.05"/>
    <circle cx="600" cy="450" r="128" fill="#8a92a5" opacity="0.05"/>
    <circle cx="600" cy="450" r="64"  fill="#9aa2b5" opacity="0.06"/>
  </g>

  <!-- faint stratum guide rings -->
  <g fill="none" stroke="#1a1f2e" stroke-width="0.4" opacity="0.6">
    <circle cx="600" cy="450" r="64"/>
    <circle cx="600" cy="450" r="128"/>
    <circle cx="600" cy="450" r="192"/>
    <circle cx="600" cy="450" r="256"/>
    <circle cx="600" cy="450" r="320"/>
  </g>

  <!-- calendar rim -->
  <g fill="#5a6275" font-size="10" text-anchor="middle">
    <text x="600" y="120">JAN</text>
    <text x="770" y="155">FEB</text>
    <text x="894" y="260">MAR</text>
    <text x="940" y="404">APR</text>
    <text x="940" y="498">MAY</text>
    <text x="894" y="640">JUN</text>
    <text x="770" y="745">JUL</text>
    <text x="600" y="780">AUG</text>
    <text x="430" y="745">SEP</text>
    <text x="306" y="640">OCT</text>
    <text x="260" y="498">NOV</text>
    <text x="260" y="404">DEC</text>
  </g>

  <!-- stratum labels (visible, since the band tint helps identify them) -->
  <g fill="#5a6275" font-size="9" font-weight="400" text-anchor="middle">
    <text x="600" y="395">FOUNDATION</text>
    <text x="600" y="331">WORKING</text>
    <text x="600" y="267">CONNECTION</text>
    <text x="600" y="203">SYNTHESIS</text>
    <text x="600" y="139">EDGE OF KNOWING</text>
  </g>

  <!-- constellation lines (no glow filter — flat) -->
  <g fill="none" stroke-width="0.6" opacity="0.6">
    <path d="M 595 410 Q 605 395 615 410" stroke="#4ade80"/>
    <path d="M 580 420 L 595 410" stroke="#4ade80"/>
    <path d="M 615 410 Q 625 420 620 435" stroke="#4ade80"/>
    <path d="M 640 330 Q 680 310 720 340" stroke="#fb923c"/>
    <path d="M 720 340 L 750 320" stroke="#fb923c"/>
    <path d="M 550 165 Q 590 145 630 165" stroke="#60a5fa"/>
    <path d="M 595 410 Q 700 280 800 220" stroke="#a78bfa" opacity="0.4"/>
    <path d="M 770 470 L 800 460" stroke="#22d3ee"/>
    <path d="M 800 460 Q 820 450 815 480" stroke="#22d3ee"/>
    <path d="M 470 470 L 440 460" stroke="#f472b6"/>
    <path d="M 540 350 L 580 360" stroke="#f87171" stroke-dasharray="2 2"/>
  </g>

  <!-- stars — v0.2 encoding (same as A) -->
  <g>
    <g transform="translate(595, 410)" opacity="0.95"><circle r="4" fill="#7dd3fc"/><circle r="1.1" fill="#4ade80"/></g>
    <g transform="translate(605, 405)" opacity="0.85"><circle r="4" fill="#7dd3fc"/><circle r="1.1" fill="#22d3ee"/></g>
    <g transform="translate(615, 410)" opacity="0.9"><rect x="-4" y="-4" width="8" height="8" fill="#fda4af"/><circle r="1.1" fill="#4ade80"/></g>
    <g transform="translate(580, 420)" opacity="0.75"><circle r="4" fill="#7dd3fc"/><circle r="1" fill="#facc15"/></g>
    <g transform="translate(620, 435)" opacity="0.7"><rect x="-3.5" y="-3.5" width="7" height="7" fill="#fde68a" transform="rotate(45)"/><circle r="0.9" fill="#4ade80"/></g>

    <g transform="translate(640, 330)" opacity="0.88"><rect x="-4" y="-4" width="8" height="8" fill="#fda4af"/><circle r="1.1" fill="#22d3ee"/></g>
    <g transform="translate(680, 320)" opacity="0.8"><circle r="4" fill="#7dd3fc"/><circle r="1.1" fill="#a78bfa"/></g>
    <g transform="translate(720, 340)" opacity="0.9"><rect x="-5.2" y="-5.2" width="10.4" height="10.4" fill="#fde68a" transform="rotate(45)"/><circle r="1.4" fill="#4ade80"/></g>
    <g transform="translate(750, 320)" opacity="0.65"><circle r="3.5" fill="#7dd3fc"/><circle r="0.9" fill="#facc15"/></g>

    <g transform="translate(550, 280)" opacity="0.78"><rect x="-4" y="-4" width="8" height="8" fill="#fda4af"/><circle r="1.1" fill="#22d3ee"/></g>
    <g transform="translate(650, 270)" opacity="0.72"><circle r="3.8" fill="#7dd3fc"/><circle r="1" fill="#a78bfa"/></g>
    <g transform="translate(700, 260)" opacity="0.85"><rect x="-5.2" y="-5.2" width="10.4" height="10.4" fill="#fde68a" transform="rotate(45)"/><circle r="1.3" fill="#22d3ee"/></g>

    <g transform="translate(580, 215)" opacity="0.6"><rect x="-3.5" y="-3.5" width="7" height="7" fill="#fde68a" transform="rotate(45)"/><circle r="0.9" fill="#facc15"/></g>
    <g transform="translate(650, 210)" opacity="0.85"><circle r="4" fill="#7dd3fc"/><circle r="1.1" fill="#22d3ee"/></g>

    <g transform="translate(595, 160)" opacity="0.5"><rect x="-3.5" y="-3.5" width="7" height="7" fill="#fda4af"/><circle r="0.9" fill="#a78bfa"/></g>
    <g transform="translate(630, 170)" opacity="0.4"><circle r="3" fill="#7dd3fc"/><circle r="0.8" fill="#94a3b8"/></g>

    <g transform="translate(770, 470)" opacity="0.85"><rect x="-5.2" y="-5.2" width="10.4" height="10.4" fill="#fde68a" transform="rotate(45)"/><circle r="1.4" fill="#4ade80"/></g>
    <g transform="translate(800, 460)" opacity="0.78"><rect x="-3.5" y="-3.5" width="7" height="7" fill="#fde68a" transform="rotate(45)"/><circle r="1" fill="#22d3ee"/></g>
    <g transform="translate(815, 480)" opacity="0.7"><circle r="3.5" fill="#7dd3fc"/><circle r="0.9" fill="#a78bfa"/></g>

    <g transform="translate(470, 470)" opacity="0.82"><rect x="-4" y="-4" width="8" height="8" fill="#fda4af"/><circle r="1.1" fill="#facc15"/></g>
    <g transform="translate(440, 460)" opacity="0.75"><rect x="-3.5" y="-3.5" width="7" height="7" fill="#fda4af"/><circle r="0.9" fill="#22d3ee"/></g>
    <g transform="translate(405, 465)" opacity="0.65"><circle r="3.5" fill="#7dd3fc"/><circle r="0.9" fill="#94a3b8"/></g>

    <g transform="translate(540, 350)" opacity="0.85"><circle r="4" fill="#7dd3fc"/><circle r="1.1" fill="#a78bfa"/></g>
    <g transform="translate(620, 720)" opacity="0.9"><circle r="4" fill="#7dd3fc"/><circle r="1.1" fill="#4ade80"/></g>
    <g transform="translate(640, 700)" opacity="0.82"><rect x="-3.5" y="-3.5" width="7" height="7" fill="#fde68a" transform="rotate(45)"/><circle r="1" fill="#22d3ee"/></g>
    <g transform="translate(580, 700)" opacity="0.75"><rect x="-3.5" y="-3.5" width="7" height="7" fill="#fda4af"/><circle r="0.9" fill="#facc15"/></g>

    <g transform="translate(380, 200)" opacity="0.35"><rect x="-2.5" y="-2.5" width="5" height="5" fill="#fde68a" transform="rotate(45)"/><circle r="0.6" fill="#94a3b8"/></g>
    <g transform="translate(870, 230)" opacity="0.3"><rect x="-2.5" y="-2.5" width="5" height="5" fill="#fda4af"/><circle r="0.6" fill="#94a3b8"/></g>
  </g>

  <!-- right-edge legend (compact) -->
  <g transform="translate(1050, 200)" font-size="10" fill="#7a8295">
    <text fill="#a0aabe" font-weight="500" font-size="11" letter-spacing="0.6">STRATUM</text>
    <g transform="translate(0, 22)" font-size="10" fill="#cdd5e0">
      <rect x="0" y="0" width="12" height="12" fill="#9aa2b5" opacity="0.18"/><text x="20" y="10">Foundation</text>
      <rect x="0" y="20" width="12" height="12" fill="#8a92a5" opacity="0.15"/><text x="20" y="30">Working</text>
      <rect x="0" y="40" width="12" height="12" fill="#7a8295" opacity="0.15"/><text x="20" y="50">Connection</text>
      <rect x="0" y="60" width="12" height="12" fill="#6a7285" opacity="0.15"/><text x="20" y="70">Synthesis</text>
      <rect x="0" y="80" width="12" height="12" fill="#5a6275" opacity="0.15"/><text x="20" y="90">Edge of Knowing</text>
    </g>

    <text x="0" y="138" fill="#a0aabe" font-weight="500" font-size="11" letter-spacing="0.6">CHANNELS</text>
    <g transform="translate(0, 158)" font-size="10" fill="#cdd5e0">
      <text y="0">shape = library</text>
      <text y="18">opacity = confidence</text>
      <text y="36">inner pip = stage</text>
      <text y="54">size +30% = top acts</text>
      <text y="72">line color = link type</text>
    </g>
  </g>

  <!-- gesture hint -->
  <g transform="translate(600, 770)" font-size="9" fill="#3a4150" text-anchor="middle">
    <text>right-click stratum to isolate · click library shape to filter · hover for diagnostic · Esc to reset</text>
  </g>

  <!-- universe state top-right -->
  <g transform="translate(1170, 100)" font-size="10" fill="#7a8295" text-anchor="end">
    <text fill="#a0aabe" font-weight="500">universe state</text>
    <text y="16">healthy · 64%</text>
    <text y="30">at-risk · 28%</text>
    <text y="44">dormant · 8%</text>
  </g>
</svg>
