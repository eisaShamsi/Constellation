<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" font-family="Inter, system-ui, sans-serif">
  <!--
    Sight redesign · v0.2 · Mock B · Quiet Detail (revised — toggle bar removed)
    ───────────────────────────────────────────────────────────────────────────
    v0.2 changes from v0.1 Lens Stack:
      • Toggle bar GONE. No L · C · S · A · P pill buttons.
      • Right-side diagnostic panel is SUMMONED, not persistent. Appears on
        stratum hover or star click; slides away on Esc / pointer-leave.
      • Same dome as A (channel taxonomy from §3).
      • This mock shows the "Connection stratum hovered" state — panel visible
        on the right showing that stratum's diagnostic readout.
  -->

  <!-- background -->
  <rect width="1200" height="800" fill="#0a0f1c"/>

  <!-- title block -->
  <text x="450" y="42" fill="#e8ebf2" font-size="20" text-anchor="middle" font-weight="500" letter-spacing="0.5">Constellation Sight</text>
  <text x="450" y="64" fill="#5a6370" font-size="11" text-anchor="middle">My Universe · 7,636 notes · 2,041 links</text>
  <text x="450" y="80" fill="#3a4150" font-size="9" text-anchor="middle">Mock B · Quiet Detail · v0.2</text>

  <!-- dome centered slightly left to leave room for the summoned panel on the right -->
  <!-- strata circles -->
  <g fill="none" stroke="#1a1f2e" stroke-width="0.6">
    <circle cx="450" cy="450" r="64"/>
    <circle cx="450" cy="450" r="128"/>
    <circle cx="450" cy="450" r="192"/>
    <circle cx="450" cy="450" r="256"/>
    <circle cx="450" cy="450" r="320"/>
  </g>

  <!-- "Connection" stratum band highlighted (subtle ring stroke) -->
  <g fill="none" stroke="#7dd3fc" stroke-width="1.4" opacity="0.45">
    <circle cx="450" cy="450" r="160"/>
  </g>

  <!-- non-Connection strata are dimmed visually (via cover overlay rings — illustrative) -->
  <g fill="none" stroke="#080c16" stroke-opacity="0.0">
    <circle cx="450" cy="450" r="64"/>
  </g>

  <!-- calendar rim -->
  <g fill="#3e4453" font-size="10" text-anchor="middle">
    <text x="450" y="120">JAN</text>
    <text x="620" y="155">FEB</text>
    <text x="744" y="260">MAR</text>
    <text x="790" y="404">APR</text>
    <text x="790" y="498">MAY</text>
    <text x="744" y="640">JUN</text>
    <text x="620" y="745">JUL</text>
    <text x="450" y="780">AUG</text>
    <text x="280" y="745">SEP</text>
    <text x="156" y="640">OCT</text>
    <text x="110" y="498">NOV</text>
    <text x="110" y="404">DEC</text>
  </g>

  <!-- stratum labels -->
  <g fill="#252b3a" font-size="9" font-style="italic" font-weight="300" text-anchor="middle">
    <text x="450" y="395">FOUNDATION</text>
    <text x="450" y="331">WORKING</text>
    <text x="450" y="267" fill="#7dd3fc">CONNECTION</text>
    <text x="450" y="203">SYNTHESIS</text>
    <text x="450" y="139">EDGE OF KNOWING</text>
  </g>

  <!-- constellation lines -->
  <g fill="none" stroke-width="0.55" opacity="0.55">
    <path d="M 445 410 Q 455 395 465 410" stroke="#4ade80"/>
    <path d="M 430 420 L 445 410" stroke="#4ade80"/>
    <path d="M 465 410 Q 475 420 470 435" stroke="#4ade80"/>
    <path d="M 490 330 Q 530 310 570 340" stroke="#fb923c"/>
    <path d="M 570 340 L 600 320" stroke="#fb923c"/>
    <path d="M 400 280 Q 440 260 480 280" stroke="#60a5fa"/>
    <path d="M 500 270 L 530 250" stroke="#60a5fa"/>
    <path d="M 620 470 L 650 460" stroke="#22d3ee"/>
    <path d="M 320 470 L 290 460" stroke="#f472b6"/>
    <path d="M 390 350 L 430 360" stroke="#f87171" stroke-dasharray="2 2"/>
  </g>

  <!-- stars (same encoding as A; centered at 450) -->
  <g>
    <!-- foundation -->
    <g transform="translate(445, 410)" opacity="0.95"><circle r="4" fill="#7dd3fc"/><circle r="1.1" fill="#4ade80"/></g>
    <g transform="translate(455, 405)" opacity="0.85"><circle r="4" fill="#7dd3fc"/><circle r="1.1" fill="#22d3ee"/></g>
    <g transform="translate(465, 410)" opacity="0.9"><rect x="-4" y="-4" width="8" height="8" fill="#fda4af"/><circle r="1.1" fill="#4ade80"/></g>
    <g transform="translate(430, 420)" opacity="0.75"><circle r="4" fill="#7dd3fc"/><circle r="1" fill="#facc15"/></g>
    <g transform="translate(470, 435)" opacity="0.7"><rect x="-3.5" y="-3.5" width="7" height="7" fill="#fde68a" transform="rotate(45)"/><circle r="0.9" fill="#4ade80"/></g>

    <!-- working -->
    <g transform="translate(490, 330)" opacity="0.88"><rect x="-4" y="-4" width="8" height="8" fill="#fda4af"/><circle r="1.1" fill="#22d3ee"/></g>
    <g transform="translate(530, 320)" opacity="0.8"><circle r="4" fill="#7dd3fc"/><circle r="1.1" fill="#a78bfa"/></g>
    <g transform="translate(570, 340)" opacity="0.9"><rect x="-5.2" y="-5.2" width="10.4" height="10.4" fill="#fde68a" transform="rotate(45)"/><circle r="1.4" fill="#4ade80"/></g>

    <!-- connection (highlighted band — these are the ones the panel describes) -->
    <g transform="translate(400, 280)" opacity="0.78"><rect x="-4" y="-4" width="8" height="8" fill="#fda4af"/><circle r="1.1" fill="#22d3ee"/></g>
    <g transform="translate(500, 270)" opacity="0.72"><circle r="3.8" fill="#7dd3fc"/><circle r="1" fill="#a78bfa"/></g>
    <g transform="translate(530, 250)" opacity="0.85"><rect x="-5.2" y="-5.2" width="10.4" height="10.4" fill="#fde68a" transform="rotate(45)"/><circle r="1.3" fill="#22d3ee"/></g>
    <g transform="translate(450, 290)" opacity="0.82"><circle r="4" fill="#7dd3fc"/><circle r="1.1" fill="#4ade80"/></g>

    <!-- synthesis -->
    <g transform="translate(430, 215)" opacity="0.6"><rect x="-3.5" y="-3.5" width="7" height="7" fill="#fde68a" transform="rotate(45)"/><circle r="0.9" fill="#facc15"/></g>
    <g transform="translate(500, 210)" opacity="0.85"><circle r="4" fill="#7dd3fc"/><circle r="1.1" fill="#22d3ee"/></g>

    <!-- edge of knowing -->
    <g transform="translate(445, 160)" opacity="0.5"><rect x="-3.5" y="-3.5" width="7" height="7" fill="#fda4af"/><circle r="0.9" fill="#a78bfa"/></g>
    <g transform="translate(480, 170)" opacity="0.4"><circle r="3" fill="#7dd3fc"/><circle r="0.8" fill="#94a3b8"/></g>

    <!-- right side -->
    <g transform="translate(620, 470)" opacity="0.85"><rect x="-5.2" y="-5.2" width="10.4" height="10.4" fill="#fde68a" transform="rotate(45)"/><circle r="1.4" fill="#4ade80"/></g>
    <g transform="translate(650, 460)" opacity="0.78"><rect x="-3.5" y="-3.5" width="7" height="7" fill="#fde68a" transform="rotate(45)"/><circle r="1" fill="#22d3ee"/></g>

    <!-- left side -->
    <g transform="translate(320, 470)" opacity="0.82"><rect x="-4" y="-4" width="8" height="8" fill="#fda4af"/><circle r="1.1" fill="#facc15"/></g>
    <g transform="translate(290, 460)" opacity="0.75"><rect x="-3.5" y="-3.5" width="7" height="7" fill="#fda4af"/><circle r="0.9" fill="#22d3ee"/></g>

    <!-- bottom -->
    <g transform="translate(390, 350)" opacity="0.85"><circle r="4" fill="#7dd3fc"/><circle r="1.1" fill="#a78bfa"/></g>
    <g transform="translate(430, 360)" opacity="0.85"><circle r="4" fill="#7dd3fc"/><circle r="1.1" fill="#facc15"/></g>
    <g transform="translate(470, 700)" opacity="0.9"><circle r="4" fill="#7dd3fc"/><circle r="1.1" fill="#4ade80"/></g>
  </g>

  <!-- summoned diagnostic panel (right side) — appearing because Connection stratum is hovered -->
  <g transform="translate(850, 130)">
    <rect width="320" height="560" rx="8" fill="#13192b" stroke="#2a3245" stroke-width="1" opacity="0.97"/>

    <text x="20" y="34" fill="#7dd3fc" font-size="13" font-weight="600" letter-spacing="0.6">CONNECTION stratum</text>
    <text x="20" y="56" fill="#7a8295" font-size="10">summoned on hover · slides away on Esc</text>

    <line x1="20" y1="78" x2="300" y2="78" stroke="#2a3245" stroke-width="1"/>

    <text x="20" y="104" fill="#a0aabe" font-size="10" letter-spacing="0.5">NOTES IN THIS STRATUM</text>
    <text x="20" y="128" fill="#cdd5e0" font-size="20" font-weight="500">1,247</text>
    <text x="20" y="150" fill="#5a6275" font-size="10">16.3% of universe</text>

    <line x1="20" y1="170" x2="300" y2="170" stroke="#2a3245" stroke-width="1"/>

    <text x="20" y="196" fill="#a0aabe" font-size="10" letter-spacing="0.5">CONFIDENCE</text>
    <g transform="translate(20, 210)" font-size="10" fill="#cdd5e0">
      <text y="14">hypothesis</text><text x="260" y="14" text-anchor="end">204</text>
      <text y="32">evidence</text><text x="260" y="32" text-anchor="end">521</text>
      <text y="50">established</text><text x="260" y="50" text-anchor="end">498</text>
      <text y="68">contested</text><text x="260" y="68" text-anchor="end">24</text>
    </g>

    <line x1="20" y1="298" x2="300" y2="298" stroke="#2a3245" stroke-width="1"/>

    <text x="20" y="324" fill="#a0aabe" font-size="10" letter-spacing="0.5">STAGE DISTRIBUTION</text>
    <g transform="translate(20, 338)" font-size="10" fill="#cdd5e0">
      <circle cx="6" cy="10" r="3" fill="#4ade80"/><text x="18" y="14">established</text><text x="260" y="14" text-anchor="end">512</text>
      <circle cx="6" cy="28" r="3" fill="#22d3ee"/><text x="18" y="32">fresh</text><text x="260" y="32" text-anchor="end">183</text>
      <circle cx="6" cy="46" r="3" fill="#a78bfa"/><text x="18" y="50">growing</text><text x="260" y="50" text-anchor="end">214</text>
      <circle cx="6" cy="64" r="3" fill="#facc15"/><text x="18" y="68">at-risk</text><text x="260" y="68" text-anchor="end">187</text>
      <circle cx="6" cy="82" r="3" fill="#94a3b8"/><text x="18" y="86">dormant</text><text x="260" y="86" text-anchor="end">151</text>
    </g>

    <line x1="20" y1="438" x2="300" y2="438" stroke="#2a3245" stroke-width="1"/>

    <text x="20" y="464" fill="#a0aabe" font-size="10" letter-spacing="0.5">DIAGNOSTIC</text>
    <text x="20" y="488" fill="#cdd5e0" font-size="11">12.1% at-risk + 12.1% dormant</text>
    <text x="20" y="506" fill="#facc15" font-size="10">→ this stratum needs renewal</text>

    <text x="20" y="536" fill="#7dd3fc" font-size="11" font-weight="500">→ open worklist for at-risk notes</text>
  </g>

  <!-- gesture hint at bottom -->
  <g transform="translate(450, 770)" font-size="9" fill="#3a4150" text-anchor="middle">
    <text>panel summoned on stratum hover · click a star for note-level detail · Esc closes</text>
  </g>

  <!-- universe state top-right (faint, in panel area) -->
  <g transform="translate(810, 100)" font-size="10" fill="#5a6275">
    <text fill="#a0aabe" font-weight="500">universe · 7,636 notes</text>
  </g>
</svg>
