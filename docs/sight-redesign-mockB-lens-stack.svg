<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" font-family="Inter, system-ui, sans-serif">
  <!--
    Sight redesign · Mock B · Lens Stack
    ─────────────────────────────────────
    Philosophy: trust the user. Five lens channels stack on the dome
    by default; a bottom pill bar lets the user isolate any one channel
    (turn the others to grayscale) to drill into a single dimension.
    The dome is the same one-mode anchor; the chrome is heavier but
    progressive disclosure is supported.

    Channels expressed bolder than Mock A so the all-on view stays
    legible without atmospheric softening.
  -->

  <defs>
    <radialGradient id="B-lib1" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#60a5fa" stop-opacity="1"/>
      <stop offset="100%" stop-color="#60a5fa" stop-opacity="0.5"/>
    </radialGradient>
    <radialGradient id="B-lib2" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f472b6" stop-opacity="1"/>
      <stop offset="100%" stop-color="#f472b6" stop-opacity="0.5"/>
    </radialGradient>
    <radialGradient id="B-lib3" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="1"/>
      <stop offset="100%" stop-color="#fbbf24" stop-opacity="0.5"/>
    </radialGradient>
  </defs>

  <!-- background (slightly lighter than Mock A) -->
  <rect width="1200" height="800" fill="#0d1322"/>

  <!-- title block -->
  <text x="600" y="40" fill="#e8ebf2" font-size="20" text-anchor="middle" font-weight="500" letter-spacing="0.5">Constellation Sight</text>
  <text x="600" y="62" fill="#7a8295" font-size="11" text-anchor="middle">My Universe · 7,636 notes · 2,041 links · 5 libraries</text>
  <text x="600" y="78" fill="#4a5160" font-size="9"  text-anchor="middle">Mock B · Lens Stack · L isolated</text>

  <!-- strata circles (more visible than A) -->
  <g fill="none" stroke="#2a3245" stroke-width="0.9">
    <circle cx="540" cy="440" r="60"/>
    <circle cx="540" cy="440" r="120"/>
    <circle cx="540" cy="440" r="180"/>
    <circle cx="540" cy="440" r="240"/>
    <circle cx="540" cy="440" r="300"/>
  </g>

  <!-- calendar rim -->
  <g fill="#5a6275" font-size="10" text-anchor="middle">
    <text x="540" y="125">JAN</text>
    <text x="700" y="158">FEB</text>
    <text x="816" y="258">MAR</text>
    <text x="858" y="390">APR</text>
    <text x="858" y="498">MAY</text>
    <text x="816" y="628">JUN</text>
    <text x="700" y="728">JUL</text>
    <text x="540" y="760">AUG</text>
    <text x="380" y="728">SEP</text>
    <text x="264" y="628">OCT</text>
    <text x="222" y="498">NOV</text>
    <text x="222" y="390">DEC</text>
  </g>

  <!-- stratum labels (visible to the left of the dome) -->
  <g fill="#6a7285" font-size="10" font-weight="500" text-anchor="end">
    <text x="225" y="384">FOUNDATION</text>
    <text x="225" y="324">WORKING</text>
    <text x="225" y="264">CONNECTION</text>
    <text x="225" y="204">SYNTHESIS</text>
    <text x="225" y="144">EDGE OF KNOWING</text>
  </g>
  <g fill="#3a4255" stroke="#3a4255" stroke-width="0.5">
    <line x1="232" y1="382" x2="478" y2="382"/>
    <line x1="232" y1="322" x2="478" y2="322"/>
    <line x1="232" y1="262" x2="478" y2="262"/>
    <line x1="232" y1="202" x2="478" y2="202"/>
    <line x1="232" y1="142" x2="478" y2="142"/>
  </g>

  <!-- constellation lines (BOLD — L is the isolated channel in this view) -->
  <g fill="none" stroke-width="1.4" opacity="0.85">
    <!-- supports (green) -->
    <path d="M 535 400 Q 545 380 555 400" stroke="#4ade80"/>
    <path d="M 555 400 L 580 390" stroke="#4ade80"/>
    <path d="M 580 390 Q 600 370 620 390" stroke="#4ade80"/>
    <!-- causes (orange) -->
    <path d="M 580 320 Q 620 300 660 320" stroke="#fb923c"/>
    <path d="M 660 320 L 690 305" stroke="#fb923c"/>
    <!-- contradicts (red, dashed) -->
    <path d="M 480 350 L 525 365" stroke="#f87171" stroke-dasharray="3 3"/>
    <path d="M 525 365 L 545 375" stroke="#f87171" stroke-dasharray="3 3"/>
    <!-- exemplifies (blue) -->
    <path d="M 500 240 Q 540 220 580 240" stroke="#60a5fa"/>
    <!-- generalizes (purple) -->
    <path d="M 720 410 L 750 400" stroke="#a78bfa"/>
    <path d="M 750 400 Q 770 390 765 420" stroke="#a78bfa"/>
    <!-- derives from (cyan) -->
    <path d="M 540 460 Q 480 480 420 470" stroke="#22d3ee"/>
    <!-- part of (pink) -->
    <path d="M 600 200 L 630 185" stroke="#f472b6"/>
  </g>

  <!-- stars (bolder per-channel encoding; ~28 stars) -->
  <g>
    <!-- foundation -->
    <g transform="translate(535, 400)"><circle r="5" fill="url(#B-lib1)"/><circle r="1.6" fill="#4ade80"/></g>
    <g transform="translate(555, 400)"><circle r="4.5" fill="url(#B-lib1)"/><circle r="1.3" fill="#22d3ee"/></g>
    <g transform="translate(580, 390)"><circle r="5" fill="url(#B-lib2)"/><circle r="1.5" fill="#4ade80"/></g>
    <g transform="translate(525, 365)"><circle r="4.2" fill="url(#B-lib1)" opacity="0.85"/><circle r="1.2" fill="#facc15"/></g>
    <g transform="translate(620, 390)"><circle r="4.5" fill="url(#B-lib3)" opacity="0.85"/><circle r="1.3" fill="#4ade80"/></g>

    <!-- working -->
    <g transform="translate(580, 320)"><circle r="4.4" fill="url(#B-lib2)"/><circle r="1.2" fill="#22d3ee"/></g>
    <g transform="translate(620, 305)"><circle r="4" fill="url(#B-lib1)" opacity="0.9"/><circle r="1.1" fill="#a78bfa"/></g>
    <g transform="translate(660, 320)"><circle r="4.6" fill="url(#B-lib3)"/><circle r="1.3" fill="#4ade80"/></g>
    <g transform="translate(690, 305)"><circle r="3.5" fill="url(#B-lib1)" opacity="0.75"/><circle r="1" fill="#facc15"/></g>

    <!-- connection -->
    <g transform="translate(480, 260)"><circle r="4" fill="url(#B-lib2)" opacity="0.85"/><circle r="1.1" fill="#22d3ee"/></g>
    <g transform="translate(580, 250)"><circle r="3.8" fill="url(#B-lib1)" opacity="0.82"/><circle r="1.1" fill="#a78bfa"/></g>
    <g transform="translate(630, 240)"><circle r="3.5" fill="url(#B-lib3)" opacity="0.8"/><circle r="1" fill="#22d3ee"/></g>

    <!-- synthesis -->
    <g transform="translate(500, 215)"><circle r="3.4" fill="url(#B-lib3)" opacity="0.7"/><circle r="0.9" fill="#facc15"/></g>
    <g transform="translate(600, 200)"><circle r="3.8" fill="url(#B-lib1)" opacity="0.9"/><circle r="1.1" fill="#22d3ee"/></g>
    <g transform="translate(630, 185)"><circle r="3.5" fill="url(#B-lib2)" opacity="0.85"/><circle r="1" fill="#a78bfa"/></g>

    <!-- edge of knowing (sparse) -->
    <g transform="translate(540, 155)"><circle r="3" fill="url(#B-lib2)" opacity="0.55"/><circle r="0.9" fill="#a78bfa"/></g>
    <g transform="translate(580, 160)"><circle r="2.6" fill="url(#B-lib1)" opacity="0.45"/><circle r="0.7" fill="#94a3b8"/></g>

    <!-- right cluster -->
    <g transform="translate(720, 410)"><circle r="4.2" fill="url(#B-lib3)" opacity="0.88"/><circle r="1.2" fill="#4ade80"/></g>
    <g transform="translate(750, 400)"><circle r="3.8" fill="url(#B-lib3)" opacity="0.8"/><circle r="1.1" fill="#22d3ee"/></g>
    <g transform="translate(765, 420)"><circle r="3.4" fill="url(#B-lib1)" opacity="0.75"/><circle r="1" fill="#a78bfa"/></g>

    <!-- left cluster -->
    <g transform="translate(420, 470)"><circle r="4" fill="url(#B-lib2)" opacity="0.85"/><circle r="1.1" fill="#facc15"/></g>
    <g transform="translate(390, 460)"><circle r="3.5" fill="url(#B-lib2)" opacity="0.78"/><circle r="1" fill="#22d3ee"/></g>
    <g transform="translate(355, 465)"><circle r="3" fill="url(#B-lib1)" opacity="0.7"/><circle r="0.9" fill="#94a3b8"/></g>

    <!-- bottom curve -->
    <g transform="translate(540, 700)"><circle r="4.4" fill="url(#B-lib1)" opacity="0.92"/><circle r="1.2" fill="#4ade80"/></g>
    <g transform="translate(580, 680)"><circle r="3.8" fill="url(#B-lib3)" opacity="0.85"/><circle r="1.1" fill="#22d3ee"/></g>
    <g transform="translate(500, 680)"><circle r="3.6" fill="url(#B-lib2)" opacity="0.78"/><circle r="1" fill="#facc15"/></g>

    <!-- diagnostic orphans -->
    <g transform="translate(320, 200)"><circle r="2.5" fill="url(#B-lib3)" opacity="0.4"/><circle r="0.7" fill="#94a3b8"/></g>
    <g transform="translate(770, 220)"><circle r="2.5" fill="url(#B-lib2)" opacity="0.35"/><circle r="0.7" fill="#94a3b8"/></g>
  </g>

  <!-- bottom lens toggle pill bar -->
  <g transform="translate(540, 760)" text-anchor="middle">
    <g transform="translate(-160, 0)">
      <rect x="-26" y="-15" width="52" height="30" rx="15" fill="#1e2a45" stroke="#3b5998" stroke-width="1.4"/>
      <text y="5" fill="#7dd3fc" font-size="13" font-weight="600">L</text>
      <text y="34" fill="#7dd3fc" font-size="9" font-weight="500">isolated</text>
    </g>
    <g transform="translate(-80, 0)">
      <rect x="-22" y="-13" width="44" height="26" rx="13" fill="#1a1f2e" stroke="#3a4255" stroke-width="1"/>
      <text y="5" fill="#5a6275" font-size="12" font-weight="500">C</text>
    </g>
    <g transform="translate(0, 0)">
      <rect x="-22" y="-13" width="44" height="26" rx="13" fill="#1a1f2e" stroke="#3a4255" stroke-width="1"/>
      <text y="5" fill="#5a6275" font-size="12" font-weight="500">S</text>
    </g>
    <g transform="translate(80, 0)">
      <rect x="-22" y="-13" width="44" height="26" rx="13" fill="#1a1f2e" stroke="#3a4255" stroke-width="1"/>
      <text y="5" fill="#5a6275" font-size="12" font-weight="500">A</text>
    </g>
    <g transform="translate(160, 0)">
      <rect x="-22" y="-13" width="44" height="26" rx="13" fill="#1a1f2e" stroke="#3a4255" stroke-width="1"/>
      <text y="5" fill="#5a6275" font-size="12" font-weight="500">P</text>
    </g>
    <text y="-30" fill="#5a6275" font-size="9" letter-spacing="0.4">LENSES (click to isolate · all on by default)</text>
  </g>

  <!-- right-side detail panel (the L lens isolated breakdown) -->
  <g transform="translate(900, 130)">
    <rect width="280" height="540" rx="6" fill="#13192b" stroke="#2a3245" stroke-width="1"/>
    <text x="20" y="32" fill="#7dd3fc" font-size="13" font-weight="600" letter-spacing="0.6">L · LINKS LENS</text>
    <text x="20" y="56" fill="#7a8295" font-size="11">2,041 typed links across universe</text>

    <line x1="20" y1="78" x2="260" y2="78" stroke="#2a3245" stroke-width="1"/>

    <g font-size="11" fill="#a0aabe">
      <g transform="translate(20, 102)">
        <circle cx="6" cy="-4" r="4" fill="#4ade80"/>
        <text x="20" y="0" fill="#cdd5e0">supports</text>
        <text x="240" y="0" text-anchor="end" fill="#7dd3fc" font-weight="500">812</text>
      </g>
      <g transform="translate(20, 130)">
        <circle cx="6" cy="-4" r="4" fill="#f87171"/>
        <text x="20" y="0" fill="#cdd5e0">contradicts</text>
        <text x="240" y="0" text-anchor="end" fill="#7dd3fc" font-weight="500">94</text>
      </g>
      <g transform="translate(20, 158)">
        <circle cx="6" cy="-4" r="4" fill="#fb923c"/>
        <text x="20" y="0" fill="#cdd5e0">causes</text>
        <text x="240" y="0" text-anchor="end" fill="#7dd3fc" font-weight="500">287</text>
      </g>
      <g transform="translate(20, 186)">
        <circle cx="6" cy="-4" r="4" fill="#60a5fa"/>
        <text x="20" y="0" fill="#cdd5e0">exemplifies</text>
        <text x="240" y="0" text-anchor="end" fill="#7dd3fc" font-weight="500">218</text>
      </g>
      <g transform="translate(20, 214)">
        <circle cx="6" cy="-4" r="4" fill="#a78bfa"/>
        <text x="20" y="0" fill="#cdd5e0">generalizes</text>
        <text x="240" y="0" text-anchor="end" fill="#7dd3fc" font-weight="500">142</text>
      </g>
      <g transform="translate(20, 242)">
        <circle cx="6" cy="-4" r="4" fill="#22d3ee"/>
        <text x="20" y="0" fill="#cdd5e0">derives-from</text>
        <text x="240" y="0" text-anchor="end" fill="#7dd3fc" font-weight="500">155</text>
      </g>
      <g transform="translate(20, 270)">
        <circle cx="6" cy="-4" r="4" fill="#f472b6"/>
        <text x="20" y="0" fill="#cdd5e0">part-of</text>
        <text x="240" y="0" text-anchor="end" fill="#7dd3fc" font-weight="500">198</text>
      </g>
      <g transform="translate(20, 298)">
        <circle cx="6" cy="-4" r="4" fill="#94a3b8"/>
        <text x="20" y="0" fill="#cdd5e0">associative</text>
        <text x="240" y="0" text-anchor="end" fill="#7dd3fc" font-weight="500">123</text>
      </g>
      <g transform="translate(20, 326)">
        <circle cx="6" cy="-4" r="4" fill="#fde68a"/>
        <text x="20" y="0" fill="#cdd5e0">supersedes</text>
        <text x="240" y="0" text-anchor="end" fill="#7dd3fc" font-weight="500">12</text>
      </g>
    </g>

    <line x1="20" y1="358" x2="260" y2="358" stroke="#2a3245" stroke-width="1"/>

    <text x="20" y="384" fill="#7a8295" font-size="10" letter-spacing="0.4">DIAGNOSTIC</text>
    <text x="20" y="408" fill="#cdd5e0" font-size="11">supports : contradicts</text>
    <text x="260" y="408" text-anchor="end" fill="#4ade80" font-size="11" font-weight="500">9 : 1</text>
    <text x="20" y="432" fill="#7a8295" font-size="10">healthy — not echo-chamber</text>

    <text x="20" y="464" fill="#cdd5e0" font-size="11">notes with zero links</text>
    <text x="260" y="464" text-anchor="end" fill="#fb923c" font-size="11" font-weight="500">412</text>
    <text x="20" y="488" fill="#7a8295" font-size="10">orphans — 5.4% of universe</text>

    <text x="20" y="520" fill="#7dd3fc" font-size="11" font-weight="500">→ go to orphan worklist</text>
  </g>

  <!-- top-right diagnostic summary -->
  <g transform="translate(1170, 100)" font-size="10" fill="#7a8295" text-anchor="end">
    <text fill="#a0aabe" font-weight="500">universe state</text>
    <text y="18">healthy · 64%</text>
    <text y="32">at-risk · 28%</text>
    <text y="46">dormant · 8%</text>
  </g>
</svg>
