<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" font-family="Inter, system-ui, sans-serif">
  <!--
    Sight redesign · v0.2 · Mock A · Suwaidi Pure (revised)
    ─────────────────────────────────────────────────────────
    v0.2 changes from v0.1:
      • Library encoded by SHAPE (circle / square / diamond / triangle / hexagon)
        instead of tint-saturation gradient. Color remains as identity hint
        but is no longer the discriminator. Fixes opacity↔saturation confound.
      • Top-decile-acts stars rendered 30% larger. Fixes pip↔dot confound.
      • Provenance removed from per-star encoding. Now a legend filter chip.
      • Stage stays as inner pip hue (now without competing acts dot).
      • No toggle bar. Gesture grammar (right-click stratum, click library shape).
  -->

  <!-- background -->
  <rect width="1200" height="800" fill="#080c16"/>

  <!-- faint deep-space dots -->
  <g fill="#1a2030" opacity="0.55">
    <circle cx="120" cy="180" r="0.5"/>
    <circle cx="280" cy="90"  r="0.6"/>
    <circle cx="950" cy="220" r="0.5"/>
    <circle cx="1100" cy="340" r="0.7"/>
    <circle cx="80"  cy="450" r="0.5"/>
    <circle cx="1130" cy="620" r="0.6"/>
    <circle cx="180" cy="680" r="0.5"/>
  </g>

  <!-- title block -->
  <text x="600" y="42" fill="#e8ebf2" font-size="20" text-anchor="middle" font-weight="500" letter-spacing="0.5">Constellation Sight</text>
  <text x="600" y="64" fill="#5a6370" font-size="11" text-anchor="middle">My Universe · 7,636 notes · 2,041 links · 5 libraries</text>
  <text x="600" y="80" fill="#3a4150" font-size="9" text-anchor="middle">Mock A · Suwaidi Pure · v0.2</text>

  <!-- strata circles (thin guides, Suwaidi-style) -->
  <g fill="none" stroke="#1a1f2e" stroke-width="0.6">
    <circle cx="600" cy="450" r="64"/>
    <circle cx="600" cy="450" r="128"/>
    <circle cx="600" cy="450" r="192"/>
    <circle cx="600" cy="450" r="256"/>
    <circle cx="600" cy="450" r="320"/>
  </g>

  <!-- calendar rim -->
  <g fill="#3e4453" font-size="10" text-anchor="middle">
    <text x="600" y="120">JAN</text>
    <text x="770" y="155">FEB</text>
    <text x="894" y="260">MAR</text>
    <text x="940" y="404">APR</text>
    <text x="940" y="498">MAY</text>
    <text x="894" y="640">JUN</text>
    <text x="770" y="745">JUL</text>
    <text x="600" y="780">AUG</text>
    <text x="430" y="745">SEP</text>
    <text x="306" y="640">OCT</text>
    <text x="260" y="498">NOV</text>
    <text x="260" y="404">DEC</text>
  </g>

  <!-- stratum labels (along vertical axis, italic, faint) -->
  <g fill="#252b3a" font-size="9" font-style="italic" font-weight="300" text-anchor="middle">
    <text x="600" y="395">FOUNDATION</text>
    <text x="600" y="331">WORKING</text>
    <text x="600" y="267">CONNECTION</text>
    <text x="600" y="203">SYNTHESIS</text>
    <text x="600" y="139">EDGE OF KNOWING</text>
  </g>

  <!-- constellation lines (color = link type, faint) -->
  <g fill="none" stroke-width="0.55" opacity="0.55">
    <path d="M 595 410 Q 605 395 615 410" stroke="#4ade80"/>     <!-- supports -->
    <path d="M 580 420 L 595 410" stroke="#4ade80"/>
    <path d="M 615 410 Q 625 420 620 435" stroke="#4ade80"/>
    <path d="M 640 330 Q 680 310 720 340" stroke="#fb923c"/>     <!-- causes -->
    <path d="M 720 340 L 750 320" stroke="#fb923c"/>
    <path d="M 550 165 Q 590 145 630 165" stroke="#60a5fa"/>     <!-- exemplifies -->
    <path d="M 595 410 Q 700 280 800 220" stroke="#a78bfa" opacity="0.4"/>  <!-- generalizes (rare cross-stratum) -->
    <path d="M 770 470 L 800 460" stroke="#22d3ee"/>             <!-- derives-from -->
    <path d="M 800 460 Q 820 450 815 480" stroke="#22d3ee"/>
    <path d="M 470 470 L 440 460" stroke="#f472b6"/>             <!-- part-of -->
    <path d="M 540 350 L 580 360" stroke="#f87171" stroke-dasharray="2 2"/>  <!-- contradicts -->
  </g>

  <!-- stars — v0.2 channel encoding:
       LIBRARY = shape (circle / square / diamond / triangle / hex)
       COLOR   = library hue (color identity, but shape is primary discriminator)
       OPACITY = confidence (0.4–1.0)
       INNER PIP HUE = stage
       SIZE    = baseline ~4 px; top-decile acts +30% (~5.5 px)
       PROVENANCE = not per-star (filter chip in legend)
  -->
  <g>
    <!-- foundation cluster — lib1 circles (blue), lib2 squares (pink), lib3 diamonds (yellow) -->
    <!-- lib1 = circle, fill #7dd3fc -->
    <g transform="translate(595, 410)" opacity="0.95">
      <circle r="4" fill="#7dd3fc"/>
      <circle r="1.1" fill="#4ade80"/>
    </g>
    <g transform="translate(605, 405)" opacity="0.85">
      <circle r="4" fill="#7dd3fc"/>
      <circle r="1.1" fill="#22d3ee"/>
    </g>
    <!-- lib2 = square (rect rotated 0), fill #fda4af -->
    <g transform="translate(615, 410)" opacity="0.9">
      <rect x="-4" y="-4" width="8" height="8" fill="#fda4af"/>
      <circle r="1.1" fill="#4ade80"/>
    </g>
    <g transform="translate(580, 420)" opacity="0.75">
      <circle r="4" fill="#7dd3fc"/>
      <circle r="1" fill="#facc15"/>
    </g>
    <!-- lib3 = diamond (rect rotated 45), fill #fde68a -->
    <g transform="translate(620, 435)" opacity="0.7">
      <rect x="-3.5" y="-3.5" width="7" height="7" fill="#fde68a" transform="rotate(45)"/>
      <circle r="0.9" fill="#4ade80"/>
    </g>

    <!-- working — top-decile acts highlighted by larger size (5.5px) -->
    <g transform="translate(640, 330)" opacity="0.88">
      <rect x="-4" y="-4" width="8" height="8" fill="#fda4af"/>
      <circle r="1.1" fill="#22d3ee"/>
    </g>
    <g transform="translate(680, 320)" opacity="0.8">
      <circle r="4" fill="#7dd3fc"/>
      <circle r="1.1" fill="#a78bfa"/>
    </g>
    <!-- top-acts star: 30% larger -->
    <g transform="translate(720, 340)" opacity="0.9">
      <rect x="-5.2" y="-5.2" width="10.4" height="10.4" fill="#fde68a" transform="rotate(45)"/>
      <circle r="1.4" fill="#4ade80"/>
    </g>
    <g transform="translate(750, 320)" opacity="0.65">
      <circle r="3.5" fill="#7dd3fc"/>
      <circle r="0.9" fill="#facc15"/>
    </g>

    <!-- connection -->
    <g transform="translate(550, 280)" opacity="0.78">
      <rect x="-4" y="-4" width="8" height="8" fill="#fda4af"/>
      <circle r="1.1" fill="#22d3ee"/>
    </g>
    <g transform="translate(650, 270)" opacity="0.72">
      <circle r="3.8" fill="#7dd3fc"/>
      <circle r="1" fill="#a78bfa"/>
    </g>
    <!-- top-acts star -->
    <g transform="translate(700, 260)" opacity="0.85">
      <rect x="-5.2" y="-5.2" width="10.4" height="10.4" fill="#fde68a" transform="rotate(45)"/>
      <circle r="1.3" fill="#22d3ee"/>
    </g>

    <!-- synthesis -->
    <g transform="translate(580, 215)" opacity="0.6">
      <rect x="-3.5" y="-3.5" width="7" height="7" fill="#fde68a" transform="rotate(45)"/>
      <circle r="0.9" fill="#facc15"/>
    </g>
    <g transform="translate(650, 210)" opacity="0.85">
      <circle r="4" fill="#7dd3fc"/>
      <circle r="1.1" fill="#22d3ee"/>
    </g>

    <!-- edge of knowing (sparse) -->
    <g transform="translate(595, 160)" opacity="0.5">
      <rect x="-3.5" y="-3.5" width="7" height="7" fill="#fda4af"/>
      <circle r="0.9" fill="#a78bfa"/>
    </g>
    <g transform="translate(630, 170)" opacity="0.4">
      <circle r="3" fill="#7dd3fc"/>
      <circle r="0.8" fill="#94a3b8"/>
    </g>

    <!-- right cluster — top-acts highlighted -->
    <g transform="translate(770, 470)" opacity="0.85">
      <rect x="-5.2" y="-5.2" width="10.4" height="10.4" fill="#fde68a" transform="rotate(45)"/>
      <circle r="1.4" fill="#4ade80"/>
    </g>
    <g transform="translate(800, 460)" opacity="0.78">
      <rect x="-3.5" y="-3.5" width="7" height="7" fill="#fde68a" transform="rotate(45)"/>
      <circle r="1" fill="#22d3ee"/>
    </g>
    <g transform="translate(815, 480)" opacity="0.7">
      <circle r="3.5" fill="#7dd3fc"/>
      <circle r="0.9" fill="#a78bfa"/>
    </g>

    <!-- left cluster -->
    <g transform="translate(470, 470)" opacity="0.82">
      <rect x="-4" y="-4" width="8" height="8" fill="#fda4af"/>
      <circle r="1.1" fill="#facc15"/>
    </g>
    <g transform="translate(440, 460)" opacity="0.75">
      <rect x="-3.5" y="-3.5" width="7" height="7" fill="#fda4af"/>
      <circle r="0.9" fill="#22d3ee"/>
    </g>
    <g transform="translate(405, 465)" opacity="0.65">
      <circle r="3.5" fill="#7dd3fc"/>
      <circle r="0.9" fill="#94a3b8"/>
    </g>

    <!-- bottom curve -->
    <g transform="translate(540, 350)" opacity="0.85">
      <circle r="4" fill="#7dd3fc"/>
      <circle r="1.1" fill="#a78bfa"/>
    </g>
    <g transform="translate(620, 720)" opacity="0.9">
      <circle r="4" fill="#7dd3fc"/>
      <circle r="1.1" fill="#4ade80"/>
    </g>
    <g transform="translate(640, 700)" opacity="0.82">
      <rect x="-3.5" y="-3.5" width="7" height="7" fill="#fde68a" transform="rotate(45)"/>
      <circle r="1" fill="#22d3ee"/>
    </g>
    <g transform="translate(580, 700)" opacity="0.75">
      <rect x="-3.5" y="-3.5" width="7" height="7" fill="#fda4af"/>
      <circle r="0.9" fill="#facc15"/>
    </g>

    <!-- diagnostic orphans (small + faded) -->
    <g transform="translate(380, 200)" opacity="0.35">
      <rect x="-2.5" y="-2.5" width="5" height="5" fill="#fde68a" transform="rotate(45)"/>
      <circle r="0.6" fill="#94a3b8"/>
    </g>
    <g transform="translate(870, 230)" opacity="0.3">
      <rect x="-2.5" y="-2.5" width="5" height="5" fill="#fda4af"/>
      <circle r="0.6" fill="#94a3b8"/>
    </g>
  </g>

  <!-- legend (left side) — shape, opacity, hue, size, plus provenance filter chips -->
  <g transform="translate(28, 590)" font-size="10" fill="#5a6270">
    <text fill="#7a8090" font-weight="500" font-size="11" letter-spacing="0.5">LIBRARY (shape)</text>
    <g transform="translate(0, 18)" font-size="10" fill="#a0aabe">
      <circle cx="6" cy="-4" r="4" fill="#7dd3fc"/><text x="18" y="0">Research</text>
      <rect x="2" y="22" width="8" height="8" fill="#fda4af"/><text x="18" y="30">Projects</text>
      <rect x="2" y="52" width="7" height="7" fill="#fde68a" transform="rotate(45 5.5 55.5)"/><text x="18" y="60">Personal</text>
    </g>

    <text x="120" y="0" fill="#7a8090" font-weight="500" font-size="11" letter-spacing="0.5">STAGE (inner pip)</text>
    <g transform="translate(120, 18)" font-size="10" fill="#a0aabe">
      <circle cx="6" cy="-4" r="2.5" fill="#4ade80"/><text x="18" y="0">established</text>
      <circle cx="6" cy="26" r="2.5" fill="#22d3ee"/><text x="18" y="30">fresh</text>
      <circle cx="6" cy="56" r="2.5" fill="#a78bfa"/><text x="18" y="60">growing</text>
      <circle cx="6" cy="86" r="2.5" fill="#facc15"/><text x="18" y="90">at-risk</text>
      <circle cx="6" cy="116" r="2.5" fill="#94a3b8"/><text x="18" y="120">dormant</text>
    </g>

    <text x="260" y="0" fill="#7a8090" font-weight="500" font-size="11" letter-spacing="0.5">OTHER CHANNELS</text>
    <g transform="translate(260, 18)" font-size="10" fill="#a0aabe">
      <text y="0">opacity = confidence</text>
      <text y="20">size +30% = top-decile acts</text>
      <text y="40">line color = link type</text>
    </g>
  </g>

  <!-- provenance filter chips (legend bottom-right) -->
  <g transform="translate(720, 690)" font-size="10" fill="#a0aabe">
    <text x="0" y="0" fill="#7a8090" font-weight="500" font-size="11" letter-spacing="0.5">PROVENANCE FILTER</text>
    <g transform="translate(0, 18)">
      <rect x="0" y="0" width="60" height="22" rx="11" fill="#1a1f2e" stroke="#3a4255"/><text x="30" y="14" text-anchor="middle">Self</text>
      <rect x="68" y="0" width="60" height="22" rx="11" fill="#1a1f2e" stroke="#3a4255"/><text x="98" y="14" text-anchor="middle">Read</text>
      <rect x="136" y="0" width="60" height="22" rx="11" fill="#1a1f2e" stroke="#3a4255"/><text x="166" y="14" text-anchor="middle">Heard</text>
      <rect x="204" y="0" width="76" height="22" rx="11" fill="#1a1f2e" stroke="#3a4255"/><text x="242" y="14" text-anchor="middle">Reasoned</text>
      <rect x="288" y="0" width="76" height="22" rx="11" fill="#1a1f2e" stroke="#3a4255"/><text x="326" y="14" text-anchor="middle">Tradition</text>
    </g>
    <text y="56" fill="#5a6270" font-size="9">click to filter dome by source bucket</text>
  </g>

  <!-- gesture hint at bottom -->
  <g transform="translate(600, 770)" font-size="9" fill="#3a4150" text-anchor="middle">
    <text>right-click stratum to isolate · click library shape to filter · hover for diagnostic popover · Esc to reset</text>
  </g>

  <!-- diagnostic indicator (top-right) -->
  <g transform="translate(1170, 100)" font-size="10" fill="#5a6270" text-anchor="end">
    <text fill="#7a8090" font-weight="500">universe state</text>
    <text y="16">healthy · 64%</text>
    <text y="30">at-risk · 28%</text>
    <text y="44">dormant · 8%</text>
  </g>
</svg>
